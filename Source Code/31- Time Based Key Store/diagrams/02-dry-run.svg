<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img">
  <title>Time Based Store animated dry run</title>
  <defs>
    <style>
      * { font-family: ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
:root { --total: 14s; }
.p1 { animation: p1 var(--total) infinite; transform-box: fill-box; transform-origin: center; }
.cap0,.state0,.step0 { animation: cap0 var(--total) infinite; }
@keyframes cap0 { 0%,0.0%{opacity:0} 1.0%,17.5%{opacity:1} 18.5%,100%{opacity:0} }
.cap1,.state1,.step1 { animation: cap1 var(--total) infinite; }
@keyframes cap1 { 0%,17.5%{opacity:0} 18.5%,35.0%{opacity:1} 36.0%,100%{opacity:0} }
.cap2,.state2,.step2 { animation: cap2 var(--total) infinite; }
@keyframes cap2 { 0%,35.0%{opacity:0} 36.0%,52.5%{opacity:1} 53.5%,100%{opacity:0} }
.cap3,.state3,.step3 { animation: cap3 var(--total) infinite; }
@keyframes cap3 { 0%,52.5%{opacity:0} 53.5%,70.0%{opacity:1} 71.0%,100%{opacity:0} }
@keyframes p1 { 0%,100% { transform: translateX(0); 70%,100% { transform: translateX(0); } } 1.0%{transform:translateX(0px)} 17.5%{transform:translateX(0px)} 18.5%{transform:translateX(0px)} 35.0%{transform:translateX(0px)} 36.0%{transform:translateX(108px)} 52.5%{transform:translateX(108px)} 53.5%{transform:translateX(0px)} 70.0%{transform:translateX(0px)} }}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}.c1,.c2,.c3,.c4,.c5,.c6,.c7{opacity:0!important}:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7):not(:has(~:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7))){opacity:1!important}.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10{opacity:0!important}:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10):not(:has(~:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10))){opacity:1!important}.row1,.row2,.row3{opacity:0!important}:is(.row1,.row2,.row3):not(:has(~:is(.row1,.row2,.row3))){opacity:1!important}.v1,.v2,.v3,.v4,.v5,.v6{opacity:0!important}:is(.v1,.v2,.v3,.v4,.v5,.v6):not(:has(~:is(.v1,.v2,.v3,.v4,.v5,.v6))){opacity:1!important}.out0,.out1,.out2{opacity:0!important}:is(.out0,.out1,.out2):not(:has(~:is(.out0,.out1,.out2))){opacity:1!important}[class^=cap]{opacity:0!important}[class^=cap]:not(:has(~[class^=cap])){opacity:1!important}[class^=count]{opacity:0!important}[class^=count]:not(:has(~[class^=count])){opacity:1!important}[class^=state]{opacity:0!important}[class^=state]:not(:has(~[class^=state])){opacity:1!important}[class^=step]{opacity:0!important}[class^=step]:not(:has(~[class^=step])){opacity:1!important}svg:has(.final) [class^=cap]{opacity:0!important}.final{opacity:1!important}[class^=p],[class*=" p"]{display:none!important}}
    </style>
    <style>* { animation-timing-function: steps(1, end) !important; } .answer { opacity:0; animation:answer var(--total) infinite; } @keyframes answer { 0%,70%{opacity:0} 72%,98%{opacity:1} 100%{opacity:0} }</style>
  </defs>
  <rect width="800" height="360" rx="24" fill="#0f172a"/>
<text x="32" y="38" fill="#94a3b8" font-size="16" class="mono">Save &lt;= timestamp; search later entries</text>
<g class="step0"><text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 1 / 4</text></g>
<g class="step1"><text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 2 / 4</text></g>
<g class="step2"><text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 3 / 4</text></g>
<g class="step3"><text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 4 / 4</text></g>
<g><rect x="38" y="102" width="90" height="74" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="83" y="137" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700" class="mono">high</text><text x="83" y="160" text-anchor="middle" fill="#94a3b8" font-size="14">t=10</text><text x="83" y="190" text-anchor="middle" fill="#94a3b8" font-size="14">0</text><rect x="146" y="102" width="90" height="74" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="191" y="137" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700" class="mono">low</text><text x="191" y="160" text-anchor="middle" fill="#94a3b8" font-size="14">t=20</text><text x="191" y="190" text-anchor="middle" fill="#94a3b8" font-size="14">1</text></g><rect x="585" y="70" width="170" height="168" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><text x="670" y="98" text-anchor="middle" fill="#94a3b8" font-size="16">DATA STATE</text><g class="state0"><text x="670" y="145" text-anchor="middle" fill="#e2e8f0" font-size="16" class="mono">query=15</text></g><g class="state1"><text x="670" y="145" text-anchor="middle" fill="#e2e8f0" font-size="16" class="mono">save high</text></g><g class="state2"><text x="670" y="145" text-anchor="middle" fill="#e2e8f0" font-size="16" class="mono">20 &gt;15</text></g><g class="state3"><text x="670" y="145" text-anchor="middle" fill="#e2e8f0" font-size="16" class="mono">return high</text></g><g class="p1"><path d="M83 68 L83 50" stroke="#38bdf8" stroke-width="4"/><text x="83" y="44" text-anchor="middle" fill="#38bdf8" font-size="14">i</text></g>
<g class="answer"><text x="670" y="194" text-anchor="middle" fill="#22c55e" font-size="16" class="mono">return "high"</text></g>
  <rect x="55" y="270" width="690" height="58" rx="12" fill="#1e293b"/>
<g class="cap0"><text x="400" y="306" text-anchor="middle" fill="#38bdf8" font-size="18" class="mono">get love at 15</text></g>
<g class="cap1"><text x="400" y="306" text-anchor="middle" fill="#38bdf8" font-size="18" class="mono">10 &lt;=15</text></g>
<g class="cap2"><text x="400" y="306" text-anchor="middle" fill="#38bdf8" font-size="18" class="mono">move right bound</text></g>
<g class="cap3"><text x="400" y="306" text-anchor="middle" fill="#22c55e" font-size="18" class="mono">latest valid is high</text></g>

</svg>
