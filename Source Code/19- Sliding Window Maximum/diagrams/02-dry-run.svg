<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img">
  <style>* { animation-timing-function: steps(1, end) !important; }</style>
  <title>Sliding Window Maximum dry run</title>
  <desc>All eight iterations show deque index changes and the six maximum values.</desc>
  <defs>
    <style>
      * { font-family: ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
      :root { --total: 14s; }
      .pointer { animation: pointer var(--total) linear infinite; transform-box: fill-box; transform-origin: center; }
      .s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8 { opacity: 0; animation-duration: var(--total); animation-iteration-count: infinite; }
      .s1 { animation-name: s1; } .s2 { animation-name: s2; }
      .s3 { animation-name: s3; } .s4 { animation-name: s4; }
      .s5 { animation-name: s5; } .s6 { animation-name: s6; }
      .s7 { animation-name: s7; } .s8 { animation-name: s8; }
      @keyframes pointer {
        0%,1% { transform: translateX(0); opacity: 0; }
        2%,10% { transform: translateX(0); opacity: 1; }
        12%,20% { transform: translateX(60px); opacity: 1; }
        22%,30% { transform: translateX(120px); opacity: 1; }
        32%,40% { transform: translateX(180px); opacity: 1; }
        42%,50% { transform: translateX(240px); opacity: 1; }
        52%,60% { transform: translateX(300px); opacity: 1; }
        62%,70% { transform: translateX(360px); opacity: 1; }
        72%,90% { transform: translateX(420px); opacity: 1; }
        96% { transform: translateX(420px); opacity: 0; }
        100% { transform: translateX(0); opacity: 0; }
      }
      @keyframes s1 { 0%,9%,96%,100% { opacity: 1; } 11%,94% { opacity: 0; } }
      @keyframes s2 { 0%,100% { opacity: 0; } 12%,20% { opacity: 1; } 22%,98% { opacity: 0; } }
      @keyframes s3 { 0%,100% { opacity: 0; } 22%,30% { opacity: 1; } 32%,98% { opacity: 0; } }
      @keyframes s4 { 0%,100% { opacity: 0; } 32%,40% { opacity: 1; } 42%,98% { opacity: 0; } }
      @keyframes s5 { 0%,100% { opacity: 0; } 42%,50% { opacity: 1; } 52%,98% { opacity: 0; } }
      @keyframes s6 { 0%,100% { opacity: 0; } 52%,60% { opacity: 1; } 62%,98% { opacity: 0; } }
      @keyframes s7 { 0%,100% { opacity: 0; } 62%,70% { opacity: 1; } 72%,98% { opacity: 0; } }
      @keyframes s8 { 0%,100% { opacity: 0; } 72%,92% { opacity: 1; } 94%,98% { opacity: 0; } }
      @media(prefers-reduced-motion:reduce){*{animation:none!important}.c1,.c2,.c3,.c4,.c5,.c6,.c7{opacity:0!important}:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7):not(:has(~:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7))){opacity:1!important}.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10{opacity:0!important}:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10):not(:has(~:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10))){opacity:1!important}.row1,.row2,.row3{opacity:0!important}:is(.row1,.row2,.row3):not(:has(~:is(.row1,.row2,.row3))){opacity:1!important}.v1,.v2,.v3,.v4,.v5,.v6{opacity:0!important}:is(.v1,.v2,.v3,.v4,.v5,.v6):not(:has(~:is(.v1,.v2,.v3,.v4,.v5,.v6))){opacity:1!important}.out0,.out1,.out2{opacity:0!important}:is(.out0,.out1,.out2):not(:has(~:is(.out0,.out1,.out2))){opacity:1!important}[class^=cap]{opacity:0!important}[class^=cap]:not(:has(~[class^=cap])){opacity:1!important}[class^=count]{opacity:0!important}[class^=count]:not(:has(~[class^=count])){opacity:1!important}[class^=state]{opacity:0!important}[class^=state]:not(:has(~[class^=state])){opacity:1!important}[class^=step]{opacity:0!important}[class^=step]:not(:has(~[class^=step])){opacity:1!important}svg:has(.final) [class^=cap]{opacity:0!important}.final{opacity:1!important}[class^=p],[class*=" p"]{display:none!important}}
    </style>
  </defs>
  <rect width="800" height="360" rx="24" fill="#0f172a"/>
  <text x="32" y="38" fill="#94a3b8" font-size="16" class="mono">nums = [1,3,-1,-3,5,3,6,7], k = 3</text>
  <text class="s1 mono" x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 1 / 8</text>
  <text class="s2 mono" x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 2 / 8</text>
  <text class="s3 mono" x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 3 / 8</text>
  <text class="s4 mono" x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 4 / 8</text>
  <text class="s5 mono" x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 5 / 8</text>
  <text class="s6 mono" x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 6 / 8</text>
  <text class="s7 mono" x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 7 / 8</text>
  <text class="s8 mono" x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 8 / 8</text>
  <g class="mono" text-anchor="middle" font-size="19">
    <g transform="translate(40 92)"><rect width="50" height="58" rx="8" fill="#1e293b" stroke="#475569"/><text x="25" y="36">1</text><text x="25" y="78" fill="#94a3b8" font-size="14">0</text></g>
    <g transform="translate(100 92)"><rect width="50" height="58" rx="8" fill="#1e293b" stroke="#475569"/><text x="25" y="36">3</text><text x="25" y="78" fill="#94a3b8" font-size="14">1</text></g>
    <g transform="translate(160 92)"><rect width="50" height="58" rx="8" fill="#1e293b" stroke="#475569"/><text x="25" y="36">-1</text><text x="25" y="78" fill="#94a3b8" font-size="14">2</text></g>
    <g transform="translate(220 92)"><rect width="50" height="58" rx="8" fill="#1e293b" stroke="#475569"/><text x="25" y="36">-3</text><text x="25" y="78" fill="#94a3b8" font-size="14">3</text></g>
    <g transform="translate(280 92)"><rect width="50" height="58" rx="8" fill="#1e293b" stroke="#475569"/><text x="25" y="36">5</text><text x="25" y="78" fill="#94a3b8" font-size="14">4</text></g>
    <g transform="translate(340 92)"><rect width="50" height="58" rx="8" fill="#1e293b" stroke="#475569"/><text x="25" y="36">3</text><text x="25" y="78" fill="#94a3b8" font-size="14">5</text></g>
    <g transform="translate(400 92)"><rect width="50" height="58" rx="8" fill="#1e293b" stroke="#475569"/><text x="25" y="36">6</text><text x="25" y="78" fill="#94a3b8" font-size="14">6</text></g>
    <g transform="translate(460 92)"><rect width="50" height="58" rx="8" fill="#1e293b" stroke="#475569"/><text x="25" y="36">7</text><text x="25" y="78" fill="#94a3b8" font-size="14">7</text></g>
  </g>
  <g class="pointer"><path d="M65 82 L57 66 H73 Z" fill="#38bdf8"/></g>
  <rect x="550" y="70" width="205" height="168" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="652" y="98" text-anchor="middle" fill="#94a3b8" font-size="16">deque · result</text>
  <g class="s1 mono" text-anchor="middle" font-size="14"><text x="652" y="145">[0]</text><text x="652" y="185" text-anchor="middle" fill="#22c55e">out=[0,0,0,0,0,0]</text></g>
  <g class="s2 mono" text-anchor="middle" font-size="14"><text x="652" y="145">[1]</text><text x="652" y="185" text-anchor="middle" fill="#22c55e">out=[0,0,0,0,0,0]</text></g>
  <g class="s3 mono" text-anchor="middle" font-size="14"><text x="652" y="145">[1,2]</text><text x="652" y="185" text-anchor="middle" fill="#22c55e">out=[3,0,0,0,0,0]</text></g>
  <g class="s4 mono" text-anchor="middle" font-size="14"><text x="652" y="145">[1,2,3]</text><text x="652" y="185" text-anchor="middle" fill="#22c55e">out=[3,3,0,0,0,0]</text></g>
  <g class="s5 mono" text-anchor="middle" font-size="14"><text x="652" y="145">[4]</text><text x="652" y="185" text-anchor="middle" fill="#22c55e">out=[3,3,5,0,0,0]</text></g>
  <g class="s6 mono" text-anchor="middle" font-size="14"><text x="652" y="145">[4,5]</text><text x="652" y="185" text-anchor="middle" fill="#22c55e">out=[3,3,5,5,0,0]</text></g>
  <g class="s7 mono" text-anchor="middle" font-size="14"><text x="652" y="145">[6]</text><text x="652" y="185" text-anchor="middle" fill="#22c55e">out=[3,3,5,5,6,0]</text></g>
  <g class="s8 mono" text-anchor="middle" font-size="14"><text x="652" y="145">[7]</text><text x="652" y="185" text-anchor="middle" fill="#22c55e">out=[3,3,5,5,6,7]</text></g>
  <rect x="40" y="270" width="720" height="58" rx="12" fill="#1e293b"/>
  <g class="s1"><text x="400" y="306" text-anchor="middle" fill="#38bdf8" font-size="16" class="mono">r=0: push 0; no window output yet</text></g>
  <g class="s2"><text x="400" y="306" text-anchor="middle" fill="#38bdf8" font-size="16" class="mono">r=1: pop 0 (1&lt;3); push 1</text></g>
  <g class="s3"><text x="400" y="306" text-anchor="middle" fill="#38bdf8" font-size="16" class="mono">r=2: push 2; window [0,2] outputs 3</text></g>
  <g class="s4"><text x="400" y="306" text-anchor="middle" fill="#38bdf8" font-size="16" class="mono">r=3: push 3; window [1,3] outputs 3</text></g>
  <g class="s5"><text x="400" y="306" text-anchor="middle" fill="#f59e0b" font-size="16" class="mono">r=4: expire 1; pop 3,2; push 4; output 5</text></g>
  <g class="s6"><text x="400" y="306" text-anchor="middle" fill="#38bdf8" font-size="16" class="mono">r=5: push 5; window [3,5] outputs 5</text></g>
  <g class="s7"><text x="400" y="306" text-anchor="middle" fill="#f59e0b" font-size="16" class="mono">r=6: pop 5,4; push 6; output 6</text></g>
  <g class="s8"><text x="400" y="306" text-anchor="middle" fill="#22c55e" font-size="16" class="mono">r=7: pop 6; push 7; output 7</text></g>
  <text x="400" y="348" text-anchor="middle" fill="#22c55e" font-size="15" class="mono">return [3,3,5,5,6,7] · loop 14s</text>
</svg>
