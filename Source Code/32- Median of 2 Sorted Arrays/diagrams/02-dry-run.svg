<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img">
  <title>Median of Two Sorted Arrays dry run</title>
  <defs>
    <style>
      * { font-family: ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
      .s0,.s1,.s2,.s3 { opacity: 0; }
      .s0 { animation: s0 14s infinite; }
      .s1 { animation: s1 14s infinite; }
      .s2 { animation: s2 14s infinite; }
      .s3 { animation: s3 14s infinite; }
      @keyframes s0 { 0%,1%,19%,100% { opacity: 1; } 20%,99% { opacity: 0; } }
      @keyframes s1 { 0%,23% { opacity: 0; } 24%,44% { opacity: 1; } 45%,100% { opacity: 0; } }
      @keyframes s2 { 0%,47% { opacity: 0; } 48%,68% { opacity: 1; } 69%,100% { opacity: 0; } }
      @keyframes s3 { 0%,71% { opacity: 0; } 72%,94% { opacity: 1; } 95%,100% { opacity: 0; } }
      @media(prefers-reduced-motion:reduce){*{animation:none!important}.c1,.c2,.c3,.c4,.c5,.c6,.c7{opacity:0!important}:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7):not(:has(~:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7))){opacity:1!important}.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10{opacity:0!important}:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10):not(:has(~:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10))){opacity:1!important}.row1,.row2,.row3{opacity:0!important}:is(.row1,.row2,.row3):not(:has(~:is(.row1,.row2,.row3))){opacity:1!important}.v1,.v2,.v3,.v4,.v5,.v6{opacity:0!important}:is(.v1,.v2,.v3,.v4,.v5,.v6):not(:has(~:is(.v1,.v2,.v3,.v4,.v5,.v6))){opacity:1!important}.out0,.out1,.out2{opacity:0!important}:is(.out0,.out1,.out2):not(:has(~:is(.out0,.out1,.out2))){opacity:1!important}[class^=cap]{opacity:0!important}[class^=cap]:not(:has(~[class^=cap])){opacity:1!important}[class^=count]{opacity:0!important}[class^=count]:not(:has(~[class^=count])){opacity:1!important}[class^=state]{opacity:0!important}[class^=state]:not(:has(~[class^=state])){opacity:1!important}[class^=step]{opacity:0!important}[class^=step]:not(:has(~[class^=step])){opacity:1!important}svg:has(.final) [class^=cap]{opacity:0!important}.final{opacity:1!important}[class^=p],[class*=" p"]{display:none!important}}
    </style>
    <style>* { animation-timing-function: steps(1, end) !important; }</style>
  </defs>
  <rect width="800" height="360" rx="24" fill="#0f172a"/>
  <text x="32" y="38" fill="#94a3b8" font-size="16" class="mono">nums1=[1,3], nums2=[2] → A=[2], B=[1,3]</text>
  <g class="s0"><text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 1 / 3</text></g>
  <g class="s1"><text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 2 / 3</text></g>
  <g class="s2"><text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 3 / 3</text></g>
  <g class="s3"><text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Return</text></g>
  <text x="65" y="132" fill="#94a3b8" font-size="16" class="mono">A</text>
  <rect x="105" y="95" width="72" height="54" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="141" y="130" text-anchor="middle" fill="#e2e8f0" font-size="22" class="mono">2</text>
  <text x="65" y="215" fill="#94a3b8" font-size="16" class="mono">B</text>
  <rect x="105" y="178" width="72" height="54" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="141" y="213" text-anchor="middle" fill="#e2e8f0" font-size="22" class="mono">1</text>
  <rect x="185" y="178" width="72" height="54" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="221" y="213" text-anchor="middle" fill="#e2e8f0" font-size="22" class="mono">3</text>
  <path d="M177 169 V240" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="184" y="255" fill="#f59e0b" font-size="14" class="mono">j=1</text>
  <rect x="390" y="74" width="370" height="170" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="575" y="102" text-anchor="middle" fill="#94a3b8" font-size="16">PARTITION STATE</text>
  <g class="s0"><text x="575" y="144" text-anchor="middle" fill="#e2e8f0" font-size="17" class="mono">shorter input becomes A=[2]</text></g>
  <g class="s1"><text x="575" y="144" text-anchor="middle" fill="#e2e8f0" font-size="17" class="mono">half=1; i=0; j=half-i=1</text></g>
  <g class="s2"><text x="575" y="137" text-anchor="middle" fill="#e2e8f0" font-size="16" class="mono">Aleft=-∞, Aright=2</text><text x="575" y="166" text-anchor="middle" fill="#e2e8f0" font-size="16" class="mono">Bleft=1, Bright=3; cuts valid</text></g>
  <g class="s3"><text x="575" y="144" text-anchor="middle" fill="#22c55e" font-size="17" class="mono">odd total: return min(2,3)=2</text></g>
  <rect x="40" y="278" width="720" height="48" rx="12" fill="#1e293b"/>
  <g class="s0"><text x="400" y="308" text-anchor="middle" fill="#38bdf8" font-size="17" class="mono">Search the shorter array A</text></g>
  <g class="s1"><text x="400" y="308" text-anchor="middle" fill="#38bdf8" font-size="17" class="mono">Cut A at i=0 and B at j=1</text></g>
  <g class="s2"><text x="400" y="308" text-anchor="middle" fill="#38bdf8" font-size="17" class="mono">Aleft ≤ Bright and Bleft ≤ Aright</text></g>
  <g class="s3"><text x="400" y="308" text-anchor="middle" fill="#22c55e" font-size="17" class="mono">Return median 2</text></g>
</svg>
