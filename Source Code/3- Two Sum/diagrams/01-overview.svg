<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img">
  <title>Two Sum complement lookup overview</title>
  <defs>
    <style>
      * { font-family: ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
      .look { animation: look 6s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes look { 0%,100%{opacity:.8} 50%{opacity:1} }
      @media (prefers-reduced-motion: reduce) { * { animation:none !important } }
    </style>
  </defs>
  <rect width="800" height="360" rx="24" fill="#0f172a"/>
  <text x="400" y="42" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Target 9: look for the complement</text>
  <g class="look">
    <rect x="55" y="118" width="110" height="96" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="110" y="174" text-anchor="middle" fill="#e2e8f0" font-size="30" class="mono">7</text>
  </g>
  <text x="205" y="153" fill="#94a3b8" font-size="18">needed by</text>
  <rect x="205" y="168" width="150" height="54" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="280" y="202" text-anchor="middle" fill="#e2e8f0" font-size="22" class="mono">9 - 2 = 7</text>
  <path d="M355 195 H420" stroke="#38bdf8" stroke-width="5"/>
  <rect x="420" y="82" width="325" height="220" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
  <text x="582" y="112" text-anchor="middle" fill="#94a3b8" font-size="16">numIndexMapper</text>
  <rect x="455" y="132" width="255" height="48" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
  <text x="582" y="163" text-anchor="middle" fill="#22c55e" font-size="22" class="mono">7 → index 1</text>
  <text x="582" y="220" text-anchor="middle" fill="#e2e8f0" font-size="18">return [0, 1]</text>
  <text x="400" y="322" text-anchor="middle" fill="#94a3b8" font-size="18">The map converts a future pair into an O(1) lookup.</text>
</svg>
