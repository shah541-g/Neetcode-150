<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img">
  <title>Two Sum animated dry run</title>
  <defs>
    <style>
      :root { --total: 14s; }
      * { font-family: ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
      .pointer { animation: pointer var(--total) infinite; transform-box: fill-box; transform-origin: center; }
      .s0,.s1,.s2 { animation: caption var(--total) infinite; }
      .s0 { animation-delay:0s } .s1 { animation-delay:2.8s } .s2 { animation-delay:5.6s }
      @keyframes pointer { 0%,28%{transform:translateX(0)} 31%,58%{transform:translateX(120px)}61%{transform:translateX(120px)}100%{transform:translateX(0)} }
      @keyframes caption { 0%,28%{opacity:1}31%{opacity:0}100%{opacity:1} }
      @media(prefers-reduced-motion:reduce){*{animation:none!important}.c1,.c2,.c3,.c4,.c5,.c6,.c7{opacity:0!important}:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7):not(:has(~:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7))){opacity:1!important}.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10{opacity:0!important}:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10):not(:has(~:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10))){opacity:1!important}.row1,.row2,.row3{opacity:0!important}:is(.row1,.row2,.row3):not(:has(~:is(.row1,.row2,.row3))){opacity:1!important}.v1,.v2,.v3,.v4,.v5,.v6{opacity:0!important}:is(.v1,.v2,.v3,.v4,.v5,.v6):not(:has(~:is(.v1,.v2,.v3,.v4,.v5,.v6))){opacity:1!important}.out0,.out1,.out2{opacity:0!important}:is(.out0,.out1,.out2):not(:has(~:is(.out0,.out1,.out2))){opacity:1!important}[class^=cap]{opacity:0!important}[class^=cap]:not(:has(~[class^=cap])){opacity:1!important}[class^=count]{opacity:0!important}[class^=count]:not(:has(~[class^=count])){opacity:1!important}[class^=state]{opacity:0!important}[class^=state]:not(:has(~[class^=state])){opacity:1!important}[class^=step]{opacity:0!important}[class^=step]:not(:has(~[class^=step])){opacity:1!important}svg:has(.final) [class^=cap]{opacity:0!important}.final{opacity:1!important}[class^=p],[class*=" p"]{display:none!important}}
    </style>
    <style>* { animation-timing-function: steps(1, end) !important; } g[class^="c"],text[class^="c"],g[class^="s"],text[class^="s"] { opacity:0; }</style>
  </defs>
  <rect width="800" height="360" rx="24" fill="#0f172a"/>
  <text x="32" y="38" fill="#94a3b8" font-size="16">nums = [2, 7, 11, 15], target = 9</text>
  <text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">complement = target - nums[i]</text>
  <g transform="translate(55 86)">
    <rect x="0" width="96" height="78" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <rect x="120" width="96" height="78" rx="12" fill="#1e293b" stroke="#475569"/>
    <rect x="240" width="96" height="78" rx="12" fill="#1e293b" stroke="#475569"/>
    <rect x="360" width="96" height="78" rx="12" fill="#1e293b" stroke="#475569"/>
    <text x="48" y="49" text-anchor="middle" fill="#e2e8f0" font-size="28" class="mono">2</text>
    <text x="168" y="49" text-anchor="middle" fill="#e2e8f0" font-size="28" class="mono">7</text>
    <text x="288" y="49" text-anchor="middle" fill="#e2e8f0" font-size="28" class="mono">11</text>
    <text x="408" y="49" text-anchor="middle" fill="#e2e8f0" font-size="28" class="mono">15</text>
    <text x="48" y="68" text-anchor="middle" fill="#94a3b8" font-size="14">i=0</text>
    <text x="168" y="68" text-anchor="middle" fill="#94a3b8" font-size="14">i=1</text>
    <text x="288" y="68" text-anchor="middle" fill="#94a3b8" font-size="14">i=2</text>
    <text x="408" y="68" text-anchor="middle" fill="#94a3b8" font-size="14">i=3</text>
    <g class="pointer"><path d="M48 -10 V-28" stroke="#38bdf8" stroke-width="4"/><text x="48" y="14" transform="translate(0 -48)" text-anchor="middle" fill="#38bdf8" font-size="14">i</text></g>
  </g>
  <rect x="520" y="70" width="225" height="176" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="632" y="98" text-anchor="middle" fill="#94a3b8" font-size="16">numIndexMapper</text>
  <rect x="545" y="112" width="175" height="44" rx="8" fill="#0f172a"/>
  <text x="632" y="141" text-anchor="middle" fill="#e2e8f0" font-size="18" class="mono">2 → 0</text>
  <rect x="545" y="168" width="175" height="44" rx="8" fill="#0f172a"/>
  <text x="632" y="197" text-anchor="middle" fill="#22c55e" font-size="16" class="mono">found 2 at index 0</text>
  <rect x="55" y="270" width="690" height="58" rx="12" fill="#1e293b"/>
  <g class="s0"><text x="400" y="306" text-anchor="middle" fill="#38bdf8" font-size="18" class="mono">i=0: complement=7 → store 2→0</text></g>
  <g class="s1"><text x="400" y="306" text-anchor="middle" fill="#22c55e" font-size="18" class="mono">i=1: complement=2 → found 0</text></g>
  <g class="s2"><text x="400" y="306" text-anchor="middle" fill="#22c55e" font-size="18" class="mono">return [0,1]</text></g>
</svg>
