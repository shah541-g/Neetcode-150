<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">3Sum overview</title><desc id="desc">After sorting, anchor each value and move two pointers by the triplet sum; append every zero match.</desc><rect width="800" height="360" rx="18" fill="#0f172a"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e2e8f0}.sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.card{fill:#1e293b;stroke:#475569;stroke-width:1.5}.muted{fill:#94a3b8}.blue{fill:#38bdf8}.amber{fill:#f59e0b}.green{fill:#22c55e}.purple{fill:#a78bfa}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><text class="sans" x="40" y="34" font-size="20" font-weight="700">3Sum | fix one value, scan the rest</text><text class="sans" x="40" y="59" font-size="14" fill="#94a3b8">Sort, then anchor at i and use left/right to compare each triplet sum.</text><rect x="54" y="115" width="82" height="56" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="95" y="151" font-size="18" text-anchor="middle" font-weight="700">-4</text><text class="mono" x="95" y="194" font-size="14" text-anchor="middle" fill="#94a3b8">0</text><rect x="167" y="115" width="82" height="56" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="208" y="151" font-size="18" text-anchor="middle" font-weight="700">-1</text><text class="mono" x="208" y="194" font-size="14" text-anchor="middle" fill="#94a3b8">1</text><rect x="280" y="115" width="82" height="56" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="321" y="151" font-size="18" text-anchor="middle" font-weight="700">-1</text><text class="mono" x="321" y="194" font-size="14" text-anchor="middle" fill="#94a3b8">2</text><rect x="393" y="115" width="82" height="56" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="434" y="151" font-size="18" text-anchor="middle" font-weight="700">0</text><text class="mono" x="434" y="194" font-size="14" text-anchor="middle" fill="#94a3b8">3</text><rect x="506" y="115" width="82" height="56" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="547" y="151" font-size="18" text-anchor="middle" font-weight="700">1</text><text class="mono" x="547" y="194" font-size="14" text-anchor="middle" fill="#94a3b8">4</text><rect x="619" y="115" width="82" height="56" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="660" y="151" font-size="18" text-anchor="middle" font-weight="700">2</text><text class="mono" x="660" y="194" font-size="14" text-anchor="middle" fill="#94a3b8">5</text><text class="sans" x="95" y="94" font-size="15" text-anchor="middle" font-weight="700" fill="#a78bfa">i</text><text class="sans" x="266" y="94" font-size="15" text-anchor="middle" font-weight="700" fill="#38bdf8">left</text><text class="sans" x="661" y="94" font-size="15" text-anchor="middle" font-weight="700" fill="#f59e0b">right</text><path d="M95 99V110M266 99V110M661 99V110" stroke-width="3" stroke="#a78bfa"/><rect x="72" y="235" width="656" height="86" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="400" y="263" font-size="16" text-anchor="middle">sum &gt; 0 -> right--     |     sum &lt; 0 -> left++</text><text class="mono" x="400" y="294" font-size="14" text-anchor="middle" fill="#22c55e">sum == 0 -> append [nums[i], nums[left], nums[right]]</text><text class="sans" x="400" y="314" font-size="14" text-anchor="middle" fill="#22c55e">then move both pointers</text></svg>