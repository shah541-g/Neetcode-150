<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img">
  <title>Contains Duplicate hash set overview</title>
  <defs>
    <style>
      * { font-family: ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
      .pulse { animation: pulse 6s infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity:.78 } 50% { opacity:1 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <rect width="800" height="360" rx="24" fill="#0f172a"/>
  <text x="400" y="42" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="700">Check before remembering</text>
  <g class="pulse">
    <rect x="55" y="112" width="96" height="96" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="103" y="170" text-anchor="middle" fill="#e2e8f0" font-size="30" font-weight="700" class="mono">1</text>
  </g>
  <path d="M151 160 H225" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#38bdf8"/></marker></defs>
  <rect x="255" y="96" width="230" height="128" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
  <text x="370" y="125" text-anchor="middle" fill="#94a3b8" font-size="16">unordered_set</text>
  <rect x="290" y="145" width="160" height="48" rx="10" fill="#0f172a" stroke="#475569"/>
  <text x="370" y="176" text-anchor="middle" fill="#e2e8f0" font-size="24" class="mono">{ 1, 2, 3 }</text>
  <path d="M485 160 H540" stroke="#22c55e" stroke-width="5"/>
  <rect x="570" y="112" width="175" height="96" rx="14" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
  <text x="657" y="153" text-anchor="middle" fill="#22c55e" font-size="18" font-weight="700">FOUND 1 AGAIN</text>
  <text x="657" y="184" text-anchor="middle" fill="#e2e8f0" font-size="28" font-weight="700" class="mono">return true</text>
  <text x="400" y="300" text-anchor="middle" fill="#94a3b8" font-size="18">The set remembers earlier values; count(n) detects the duplicate.</text>
</svg>
