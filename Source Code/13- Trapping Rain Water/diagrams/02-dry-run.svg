<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Trapping Rain Water dry run</title><desc id="desc">Two exact source iterations for [2,0,2], including the equal-height right-side choice and trapped middle water.</desc><rect width="800" height="360" rx="18" fill="#0f172a"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e2e8f0}.sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
:root{--step:3.5s;--total:14s}
.pointer{transform-box:fill-box;transform-origin:center;animation-duration:var(--total);animation-iteration-count:infinite;animation-timing-function:linear}
.cap0,.cap1,.count0,.count1{opacity:0;animation-duration:var(--total);animation-iteration-count:infinite;animation-timing-function:linear}
@keyframes show0{0%,0%{opacity:0}0.35%,40.826%{opacity:1}41.1765%,100%{opacity:0}}
@keyframes show1{0%,41.1765%{opacity:0}41.5265%,81.827%{opacity:1}82.3529%,100%{opacity:0}}
.cap0{animation-name:show0}.count0{animation-name:show0}.cap1{animation-name:show1}.count1{animation-name:show1}
.final{opacity:0;animation:final var(--total) linear infinite}
@keyframes final{0%,82.0029%{opacity:0}82.3529%,97.5%{opacity:1}100%{opacity:0}}
.pr{animation-name:track-r}
@keyframes track-r{0%,41.1765%{transform:translateX(0px)}55%{transform:translateX(-140px)}82.3529%,95%,97.5%{transform:translateX(-280px)}100%{transform:translateX(0px)}}
.water{opacity:0;animation:fill var(--total) linear infinite}
@keyframes fill{0%,40%{opacity:0}44%,97.5%{opacity:.72}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.c1,.c2,.c3,.c4,.c5,.c6,.c7{opacity:0!important}:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7):not(:has(~:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7))){opacity:1!important}.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10{opacity:0!important}:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10):not(:has(~:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10))){opacity:1!important}.row1,.row2,.row3{opacity:0!important}:is(.row1,.row2,.row3):not(:has(~:is(.row1,.row2,.row3))){opacity:1!important}.v1,.v2,.v3,.v4,.v5,.v6{opacity:0!important}:is(.v1,.v2,.v3,.v4,.v5,.v6):not(:has(~:is(.v1,.v2,.v3,.v4,.v5,.v6))){opacity:1!important}.out0,.out1,.out2{opacity:0!important}:is(.out0,.out1,.out2):not(:has(~:is(.out0,.out1,.out2))){opacity:1!important}[class^=cap]{opacity:0!important}[class^=cap]:not(:has(~[class^=cap])){opacity:1!important}[class^=count]{opacity:0!important}[class^=count]:not(:has(~[class^=count])){opacity:1!important}[class^=state]{opacity:0!important}[class^=state]:not(:has(~[class^=state])){opacity:1!important}[class^=step]{opacity:0!important}[class^=step]:not(:has(~[class^=step])){opacity:1!important}svg:has(.final) [class^=cap]{opacity:0!important}.final{opacity:1!important}[class^=p],[class*=" p"]{display:none!important}} </style>
 <style>* { animation-timing-function: steps(1, end) !important; }</style>
<text class="sans" x="40" y="34" font-size="20" font-weight="700">Trapping Rain Water | height = [2,0,2]</text>
<text class="sans" x="40" y="59" font-size="14" fill="#94a3b8">Equal endpoint heights take the source else branch, so r is processed first.</text>
<text class="count0 mono" x="750" y="35" font-size="14" text-anchor="end">Step 1 / 2</text><text class="count1 mono" x="750" y="35" font-size="14" text-anchor="end">Step 2 / 2</text>
<path d="M80 270H420" stroke="#475569" stroke-width="2"/>
<rect x="78" y="186" width="44" height="84" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><rect x="218" y="266" width="44" height="4" rx="2" fill="#475569"/><rect x="358" y="186" width="44" height="84" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<rect class="water" x="218" y="186" width="44" height="84" rx="4" fill="#38bdf8"/>
<text class="mono" x="100" y="178" font-size="16" text-anchor="middle">2</text><text class="mono" x="240" y="258" font-size="16" text-anchor="middle">0</text><text class="mono" x="380" y="178" font-size="16" text-anchor="middle">2</text>
<text class="mono" x="100" y="292" font-size="14" text-anchor="middle" fill="#94a3b8">0</text><text class="mono" x="240" y="292" font-size="14" text-anchor="middle" fill="#94a3b8">1</text><text class="mono" x="380" y="292" font-size="14" text-anchor="middle" fill="#94a3b8">2</text>
<g class="pointer"><text x="100" y="105" font-size="14" text-anchor="middle" fill="#38bdf8" font-weight="700">l</text><path d="M93 112H107L100 124Z" fill="#38bdf8"/></g>
<g class="pointer pr"><text x="380" y="105" font-size="14" text-anchor="middle" fill="#f59e0b" font-weight="700">r</text><path d="M373 112H387L380 124Z" fill="#f59e0b"/></g>
<rect x="455" y="92" width="315" height="202" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
<text class="sans" x="478" y="121" font-size="15" fill="#94a3b8" font-weight="700">Current state and code action</text>
<text class="cap0 mono" x="478" y="151" font-size="14">after: l=0 r=1 lMax=2 rMax=2 area=0</text>
<text class="cap0 mono" x="478" y="176" font-size="14">2 &lt; 2 is false; process right</text>
<text class="cap0 mono" x="478" y="201" font-size="14">rMax=max(2,2); area+=0; r--</text>
<text class="cap1 mono" x="478" y="231" font-size="14">after: l=0 r=0 lMax=2 rMax=2 area=2</text>
<text class="cap1 mono" x="478" y="256" font-size="14">2 &lt; 0 is false; process right</text>
<text class="cap1 mono" x="478" y="281" font-size="14">rMax=max(2,0); area+=2; r--</text>
<text class="final mono" x="478" y="326" font-size="16" fill="#22c55e">return area = 2</text>
</svg>