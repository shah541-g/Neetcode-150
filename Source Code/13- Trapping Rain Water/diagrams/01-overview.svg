<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Trapping Rain Water overview</title><desc id="desc">The two-pointer implementation updates its running maximum and adds its difference on the lower current side.</desc><rect width="800" height="360" rx="18" fill="#0f172a"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e2e8f0}.sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.card{fill:#1e293b;stroke:#475569;stroke-width:1.5}.muted{fill:#94a3b8}.blue{fill:#38bdf8}.amber{fill:#f59e0b}.green{fill:#22c55e}.purple{fill:#a78bfa}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><text class="sans" x="40" y="34" font-size="20" font-weight="700">Trapping Rain Water | process the lower side</text><text class="sans" x="40" y="59" font-size="14" fill="#94a3b8">Keep lMax and rMax; add only water bounded by the side processed this step.</text><path d="M150 275V165M400 275V275M650 275V165" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/><rect x="158" y="174" width="484" height="94" rx="7" fill="#38bdf8" opacity=".25" stroke="#38bdf8" stroke-width="2"/><text class="mono" x="150" y="149" font-size="15" text-anchor="middle" fill="#38bdf8">lMax</text><text class="mono" x="650" y="149" font-size="15" text-anchor="middle" fill="#f59e0b">rMax</text><text class="sans" x="400" y="229" font-size="14" text-anchor="middle">water added from running max</text><path d="M150 298H650" stroke="#475569" stroke-width="2"/><rect x="210" y="308" width="380" height="34" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="400" y="331" font-size="15" text-anchor="middle" fill="#22c55e">lower current height -> process that side</text></svg>