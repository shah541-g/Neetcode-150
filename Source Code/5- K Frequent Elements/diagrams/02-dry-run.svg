<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Top K frequent elements dry run</title>
  <desc id="desc">Twelve-second walkthrough for nums 1,1,1,2,2,3 and k equal to 2 using an unordered map and min-heap.</desc>
  <rect width="800" height="360" rx="18" fill="#0f172a"/>
  <style>
    text { font-family: sans-serif; fill: #e2e8f0 }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace }
    .c1,.c2,.c3,.c4,.c5,.c6,.c7,.final { opacity:0 }
    .c1 { animation:c1 14s infinite } .c2 { animation:c2 14s infinite } .c3 { animation:c3 14s infinite }
    .c4 { animation:c4 14s infinite } .c5 { animation:c5 14s infinite } .c6 { animation:c6 14s infinite }
    .c7 { animation:c7 14s infinite } .final { animation:final 14s infinite }
    .pointer { animation:pointer 14s infinite; transform-box:fill-box; transform-origin:center }
    .heapA,.heapB,.heapC { opacity:0 } .heapA {animation:heapA 14s infinite} .heapB {animation:heapB 14s infinite} .heapC {animation:heapC 14s infinite}
    @keyframes pointer {0%,8%{transform:translateX(0)}10%,21%{transform:translateX(64px)}23%,34%{transform:translateX(128px)}36%,47%{transform:translateX(192px)}49%,60%{transform:translateX(256px)}62%{transform:translateX(320px)}100%{transform:translateX(0)}}
    @keyframes c1{0%,8%{opacity:1}10%{opacity:0}100%{opacity:1}} @keyframes c2{0%,8%,23%,100%{opacity:0}10%,21%{opacity:1}}
    @keyframes c3{0%,21%,36%,100%{opacity:0}23%,34%{opacity:1}} @keyframes c4{0%,34%,49%,100%{opacity:0}36%,47%{opacity:1}}
    @keyframes c5{0%,47%,62%,100%{opacity:0}49%,60%{opacity:1}} @keyframes c6{0%,60%,76%,100%{opacity:0}62%,75%{opacity:1}}
    @keyframes c7{0%,75%,88%,100%{opacity:0}76%,87%{opacity:1}} @keyframes final{0%,88%{opacity:.35}90%{opacity:1}100%{opacity:.35}}
    @keyframes heapA{0%,34%,100%{opacity:0}36%,88%{opacity:1}} @keyframes heapB{0%,47%,100%{opacity:0}49%,88%{opacity:1}} @keyframes heapC{0%,60%,100%{opacity:0}62%,88%{opacity:1}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.c1,.c2,.c3,.c4,.c5,.c6,.c7{opacity:0!important}:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7):not(:has(~:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7))){opacity:1!important}.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10{opacity:0!important}:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10):not(:has(~:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10))){opacity:1!important}.row1,.row2,.row3{opacity:0!important}:is(.row1,.row2,.row3):not(:has(~:is(.row1,.row2,.row3))){opacity:1!important}.v1,.v2,.v3,.v4,.v5,.v6{opacity:0!important}:is(.v1,.v2,.v3,.v4,.v5,.v6):not(:has(~:is(.v1,.v2,.v3,.v4,.v5,.v6))){opacity:1!important}.out0,.out1,.out2{opacity:0!important}:is(.out0,.out1,.out2):not(:has(~:is(.out0,.out1,.out2))){opacity:1!important}[class^=cap]{opacity:0!important}[class^=cap]:not(:has(~[class^=cap])){opacity:1!important}[class^=count]{opacity:0!important}[class^=count]:not(:has(~[class^=count])){opacity:1!important}[class^=state]{opacity:0!important}[class^=state]:not(:has(~[class^=state])){opacity:1!important}[class^=step]{opacity:0!important}[class^=step]:not(:has(~[class^=step])){opacity:1!important}svg:has(.final) [class^=cap]{opacity:0!important}.final{opacity:1!important}[class^=p],[class*=" p"]{display:none!important}}
  </style>
  <style>* { animation-timing-function: steps(1, end) !important; }</style>
  <text x="40" y="34" font-size="18" font-weight="700">nums = [1,1,1,2,2,3], k = 2</text>
  <text class="c1 mono" x="760" y="34" text-anchor="end" font-size="14" fill="#94a3b8">Step 1 / 7</text>
  <text class="c2 mono" x="760" y="34" text-anchor="end" font-size="14" fill="#94a3b8">Step 2 / 7</text>
  <text class="c3 mono" x="760" y="34" text-anchor="end" font-size="14" fill="#94a3b8">Step 3 / 7</text>
  <text class="c4 mono" x="760" y="34" text-anchor="end" font-size="14" fill="#94a3b8">Step 4 / 7</text>
  <text class="c5 mono" x="760" y="34" text-anchor="end" font-size="14" fill="#94a3b8">Step 5 / 7</text>
  <text class="c6 mono" x="760" y="34" text-anchor="end" font-size="14" fill="#94a3b8">Step 6 / 7</text>
  <text class="c7 mono" x="760" y="34" text-anchor="end" font-size="14" fill="#94a3b8">Step 7 / 7</text>
  <g transform="translate(40 70)">
    <rect width="52" height="50" rx="8" fill="#1e293b" stroke="#475569"/><text x="26" y="33" text-anchor="middle" font-size="18" class="mono">1</text>
    <rect x="64" width="52" height="50" rx="8" fill="#1e293b" stroke="#475569"/><text x="90" y="33" text-anchor="middle" font-size="18" class="mono">1</text>
    <rect x="128" width="52" height="50" rx="8" fill="#1e293b" stroke="#475569"/><text x="154" y="33" text-anchor="middle" font-size="18" class="mono">1</text>
    <rect x="192" width="52" height="50" rx="8" fill="#1e293b" stroke="#475569"/><text x="218" y="33" text-anchor="middle" font-size="18" class="mono">2</text>
    <rect x="256" width="52" height="50" rx="8" fill="#1e293b" stroke="#475569"/><text x="282" y="33" text-anchor="middle" font-size="18" class="mono">2</text>
    <rect x="320" width="52" height="50" rx="8" fill="#1e293b" stroke="#475569"/><text x="346" y="33" text-anchor="middle" font-size="18" class="mono">3</text>
    <g class="pointer"><rect width="52" height="50" rx="8" fill="none" stroke="#38bdf8" stroke-width="4"/></g>
  </g>
  <g transform="translate(40 146)">
    <rect width="310" height="92" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="16" y="24" font-size="15" fill="#94a3b8">numsFreqMapper</text>
    <text class="c1 mono" x="16" y="56" font-size="16">1:1</text><text class="c2 mono" x="16" y="56" font-size="16">1:2</text>
    <text class="c3 mono" x="16" y="56" font-size="16">1:3</text><text class="c4 mono" x="16" y="56" font-size="16">also 2:1</text>
    <text class="c5 mono" x="16" y="56" font-size="16">2:2</text><text class="c6 mono" x="16" y="56" font-size="16">also 3:1</text>
  </g>
  <g transform="translate(430 70)">
    <text y="14" transform="translate(0 -24)" font-size="16" font-weight="700">for (auto&amp; it : numsFreqMapper)</text>
    <rect y="8" width="330" height="168" rx="10" fill="#1e293b" stroke="#475569"/>
    <g class="heapA"><text x="18" y="38" font-size="16" class="mono">(3,1) push</text></g>
    <g class="heapB"><text x="18" y="72" font-size="16" class="mono">(2,2) push</text></g>
    <g class="heapC"><text x="18" y="106" font-size="16" class="mono">(1,3) push; size 3 → pop</text><text x="18" y="138" font-size="17" fill="#22c55e" class="mono">kept: (2,2),(3,1)</text></g>
  </g>
  <g transform="translate(40 260)">
    <rect width="720" height="62" rx="10" fill="#1e293b" stroke="#475569"/>
    <text class="c1 mono" x="18" y="38" font-size="16">Count pass: n = 1, increment map</text>
    <text class="c2 mono" x="18" y="38" font-size="16">Count pass: n = 1, increment 1:2</text>
    <text class="c3 mono" x="18" y="38" font-size="16">Count pass: n = 1, increment 1:3</text>
    <text class="c4 mono" x="18" y="38" font-size="16">Count 2 twice; count 3 once</text>
    <text class="c5 mono" x="18" y="38" font-size="16">One valid map order: {3,1}, {2,2}, {1,3}</text>
    <text class="c6 mono" x="18" y="38" font-size="16">Heap drops smallest pair (1,3)</text>
    <text class="c7 mono" x="18" y="38" font-size="16">Drain heap values: 2 then 1</text>
  </g>
  <g class="final" transform="translate(40 330)">
    <text font-size="17" fill="#22c55e" font-weight="700">return ans = [2,1]  (top-k order is heap order)</text>
  </g>
</svg>
