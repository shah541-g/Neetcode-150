<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Longest consecutive sequence dry run</title>
  <desc id="desc">Twelve-second dry run for 100,4,200,1,3,2, showing starts and skips based on n minus 1.</desc>
  <rect width="800" height="360" rx="18" fill="#0f172a"/>
  <style>
    text { font-family:sans-serif; fill:#e2e8f0 }
    .mono { font-family:ui-monospace,Menlo,Consolas,monospace }
    .scan { animation:scan 14s infinite; transform-box:fill-box; transform-origin:center }
    .v1,.v2,.v3,.v4,.v5,.v6,.final{opacity:0}
    .v1{animation:v1 14s infinite}.v2{animation:v2 14s infinite}.v3{animation:v3 14s infinite}.v4{animation:v4 14s infinite}.v5{animation:v5 14s infinite}.v6{animation:v6 14s infinite}.final{animation:final 14s infinite}
    .chain {stroke-dasharray:252;stroke-dashoffset:252;animation:chain 14s infinite}
    @keyframes scan{0%,8%{transform:translateX(0)}10%,21%{transform:translateX(88px)}23%,34%{transform:translateX(176px)}36%,47%{transform:translateX(264px)}49%,60%{transform:translateX(352px)}62%,75%{transform:translateX(440px)}77%{transform:translateX(264px)}100%{transform:translateX(0)}}
    @keyframes v1{0%,8%{opacity:1}10%{opacity:0}100%{opacity:1}}@keyframes v2{0%,8%,23%,100%{opacity:0}10%,21%{opacity:1}}
    @keyframes v3{0%,21%,36%,100%{opacity:0}23%,34%{opacity:1}}@keyframes v4{0%,34%,49%,100%{opacity:0}36%,47%{opacity:1}}
    @keyframes v5{0%,47%,62%,100%{opacity:0}49%,60%{opacity:1}}@keyframes v6{0%,60%,77%,100%{opacity:0}62%,75%{opacity:1}}
    @keyframes chain{0%,47%{stroke-dashoffset:252}49%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:252}}
    @keyframes final{0%,88%{opacity:.35}91%{opacity:1}100%{opacity:.35}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.c1,.c2,.c3,.c4,.c5,.c6,.c7{opacity:0!important}:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7):not(:has(~:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7))){opacity:1!important}.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10{opacity:0!important}:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10):not(:has(~:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10))){opacity:1!important}.row1,.row2,.row3{opacity:0!important}:is(.row1,.row2,.row3):not(:has(~:is(.row1,.row2,.row3))){opacity:1!important}.v1,.v2,.v3,.v4,.v5,.v6{opacity:0!important}:is(.v1,.v2,.v3,.v4,.v5,.v6):not(:has(~:is(.v1,.v2,.v3,.v4,.v5,.v6))){opacity:1!important}.out0,.out1,.out2{opacity:0!important}:is(.out0,.out1,.out2):not(:has(~:is(.out0,.out1,.out2))){opacity:1!important}[class^=cap]{opacity:0!important}[class^=cap]:not(:has(~[class^=cap])){opacity:1!important}[class^=count]{opacity:0!important}[class^=count]:not(:has(~[class^=count])){opacity:1!important}[class^=state]{opacity:0!important}[class^=state]:not(:has(~[class^=state])){opacity:1!important}[class^=step]{opacity:0!important}[class^=step]:not(:has(~[class^=step])){opacity:1!important}svg:has(.final) [class^=cap]{opacity:0!important}.final{opacity:1!important}[class^=p],[class*=" p"]{display:none!important}}
  </style>
  <style>* { animation-timing-function: steps(1, end) !important; }</style>
  <text x="40" y="34" font-size="18" font-weight="700">nums = [100,4,200,1,3,2]</text>
  <text class="v1 mono" x="750" y="34" text-anchor="end" font-size="14" fill="#94a3b8">Step 1 / 6</text>
  <text class="v2 mono" x="750" y="34" text-anchor="end" font-size="14" fill="#94a3b8">Step 2 / 6</text>
  <text class="v3 mono" x="750" y="34" text-anchor="end" font-size="14" fill="#94a3b8">Step 3 / 6</text>
  <text class="v4 mono" x="750" y="34" text-anchor="end" font-size="14" fill="#94a3b8">Step 4 / 6</text>
  <text class="v5 mono" x="750" y="34" text-anchor="end" font-size="14" fill="#94a3b8">Step 5 / 6</text>
  <text class="v6 mono" x="750" y="34" text-anchor="end" font-size="14" fill="#94a3b8">Step 6 / 6</text>
  <g transform="translate(40 70)">
    <g><rect width="75" height="50" rx="8" fill="#1e293b" stroke="#475569"/><text x="37" y="33" text-anchor="middle" font-size="17" class="mono">100</text></g>
    <g transform="translate(88)"><rect width="75" height="50" rx="8" fill="#1e293b" stroke="#475569"/><text x="37" y="33" text-anchor="middle" font-size="17" class="mono">4</text></g>
    <g transform="translate(176)"><rect width="75" height="50" rx="8" fill="#1e293b" stroke="#475569"/><text x="37" y="33" text-anchor="middle" font-size="17" class="mono">200</text></g>
    <g transform="translate(264)"><rect width="75" height="50" rx="8" fill="#1e293b" stroke="#475569"/><text x="37" y="33" text-anchor="middle" font-size="17" class="mono">1</text></g>
    <g transform="translate(352)"><rect width="75" height="50" rx="8" fill="#1e293b" stroke="#475569"/><text x="37" y="33" text-anchor="middle" font-size="17" class="mono">3</text></g>
    <g transform="translate(440)"><rect width="75" height="50" rx="8" fill="#1e293b" stroke="#475569"/><text x="37" y="33" text-anchor="middle" font-size="17" class="mono">2</text></g>
    <g class="scan"><rect width="75" height="50" rx="8" fill="none" stroke="#38bdf8" stroke-width="4"/></g>
  </g>
  <g transform="translate(40 150)">
    <rect width="720" height="62" rx="10" fill="#1e293b" stroke="#475569"/>
    <text class="v1 mono" x="18" y="38" font-size="16">100: 99 absent → count 100 length 1</text>
    <text class="v2 mono" x="18" y="38" font-size="16">4: 3 exists → continue (skip)</text>
    <text class="v3 mono" x="18" y="38" font-size="16">200: 199 absent → count 200 length 1</text>
    <text class="v4 mono" x="18" y="38" font-size="16">1: 0 absent → while 2,3,4 exist; length 4</text>
    <text class="v5 mono" x="18" y="38" font-size="16">3: 2 exists → continue (skip)</text>
    <text class="v6 mono" x="18" y="38" font-size="16">2: 1 exists → continue (skip)</text>
  </g>
  <g transform="translate(95 238)">
    <path class="chain" d="M0 0H252" fill="none" stroke="#22c55e" stroke-width="5"/>
    <g fill="#22c55e"><rect width="54" height="48" rx="8"/><rect x="66" width="54" height="48" rx="8"/><rect x="132" width="54" height="48" rx="8"/><rect x="198" width="54" height="48" rx="8"/></g>
    <text x="27" y="32" text-anchor="middle" fill="#0f172a" font-size="18" class="mono">1</text>
    <text x="93" y="32" text-anchor="middle" fill="#0f172a" font-size="18" class="mono">2</text>
    <text x="159" y="32" text-anchor="middle" fill="#0f172a" font-size="18" class="mono">3</text>
    <text x="225" y="32" text-anchor="middle" fill="#0f172a" font-size="18" class="mono">4</text>
  </g>
  <g class="final" transform="translate(40 326)">
    <text font-size="18" fill="#22c55e" font-weight="700">return maxLength = 4</text>
  </g>
</svg>
