<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Longest consecutive sequence overview</title>
  <desc id="desc">A set removes membership ambiguity, and only values without a predecessor start a forward chain.</desc>
  <rect width="800" height="360" rx="18" fill="#0f172a"/>
  <style>
    text { font-family:sans-serif; fill:#e2e8f0 }
    .mono { font-family:ui-monospace,Menlo,Consolas,monospace }
    .chain { stroke-dasharray:310; stroke-dashoffset:310; animation:draw 6s ease-in-out infinite }
    @keyframes draw{0%,15%{stroke-dashoffset:310}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:310}}
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <text x="40" y="42" font-size="20" font-weight="700">Only start when n-1 is absent</text>
  <g transform="translate(40 82)">
    <text y="14" transform="translate(0 -24)" font-size="15" fill="#94a3b8">nums</text>
    <g><rect width="75" height="52" rx="8" fill="#1e293b" stroke="#475569"/><text x="37" y="34" text-anchor="middle" font-size="17" class="mono">100</text></g>
    <g transform="translate(88)"><rect width="75" height="52" rx="8" fill="#1e293b" stroke="#475569"/><text x="37" y="34" text-anchor="middle" font-size="17" class="mono">4</text></g>
    <g transform="translate(176)"><rect width="75" height="52" rx="8" fill="#1e293b" stroke="#475569"/><text x="37" y="34" text-anchor="middle" font-size="17" class="mono">200</text></g>
    <g transform="translate(264)"><rect width="75" height="52" rx="8" fill="#1e293b" stroke="#475569"/><text x="37" y="34" text-anchor="middle" font-size="17" class="mono">1</text></g>
    <g transform="translate(352)"><rect width="75" height="52" rx="8" fill="#1e293b" stroke="#475569"/><text x="37" y="34" text-anchor="middle" font-size="17" class="mono">3</text></g>
    <g transform="translate(440)"><rect width="75" height="52" rx="8" fill="#1e293b" stroke="#475569"/><text x="37" y="34" text-anchor="middle" font-size="17" class="mono">2</text></g>
  </g>
  <g transform="translate(40 178)">
    <rect width="720" height="78" rx="10" fill="#1e293b" stroke="#475569"/>
    <text x="18" y="30" font-size="15" fill="#94a3b8">numsSet</text>
    <text x="18" y="58" font-size="17" class="mono">{100,4,200,1,3,2}</text>
  </g>
  <g transform="translate(95 292)">
    <path class="chain" d="M0 0H310" fill="none" stroke="#22c55e" stroke-width="5"/>
    <g fill="#22c55e"><rect width="58" height="48" rx="8"/><rect x="84" width="58" height="48" rx="8"/><rect x="168" width="58" height="48" rx="8"/><rect x="252" width="58" height="48" rx="8"/></g>
    <text x="29" y="32" text-anchor="middle" fill="#0f172a" font-size="18" class="mono">1</text>
    <text x="113" y="32" text-anchor="middle" fill="#0f172a" font-size="18" class="mono">2</text>
    <text x="197" y="32" text-anchor="middle" fill="#0f172a" font-size="18" class="mono">3</text>
    <text x="281" y="32" text-anchor="middle" fill="#0f172a" font-size="18" class="mono">4</text>
  </g>
  <text x="650" y="320" text-anchor="middle" font-size="18" fill="#22c55e" font-weight="700">maxLength = 4</text>
</svg>
