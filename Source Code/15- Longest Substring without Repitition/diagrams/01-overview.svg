<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img">
  <title>Unique sliding window for longest substring without repetition</title>
  <rect width="800" height="360" rx="18" fill="#0f172a"/>
  <text x="40" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="20" font-weight="700">Key idea: shrink the window until the duplicate is gone</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">
    <g transform="translate(95 92)"><rect width="70" height="64" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/><text x="35" y="41" fill="#22c55e">a</text></g>
    <g transform="translate(175 92)"><rect width="70" height="64" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/><text x="35" y="41" fill="#22c55e">b</text></g>
    <g transform="translate(255 92)"><rect width="70" height="64" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="35" y="41" fill="#94a3b8">b</text></g>
    <g transform="translate(335 92)"><rect width="70" height="64" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="3"/><text x="35" y="41" fill="#ef4444" font-weight="700">a</text></g>
  </g>
  <rect x="410" y="82" width="220" height="132" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="520" y="108" fill="#94a3b8" font-family="sans-serif" font-size="16" text-anchor="middle">visitedChars set</text>
  <text x="520" y="145" fill="#a78bfa" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">{ a, b }</text>
  <text x="520" y="190" fill="#ef4444" font-family="sans-serif" font-size="15" text-anchor="middle">a is already present</text>
  <path d="M405 152 C390 152 375 152 365 152" fill="none" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#ef4444"/></marker></defs>
  <rect x="95" y="236" width="535" height="76" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="362" y="266" fill="#94a3b8" font-family="sans-serif" font-size="15" text-anchor="middle">while set contains currentChar</text>
  <text x="362" y="296" fill="#38bdf8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19" text-anchor="middle">erase(s[left]); left++</text>
  <style>
    .pulse { animation:pulse 6s ease-in-out infinite }
    @keyframes pulse {0%,100%{opacity:1}50%{opacity:.6}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
</svg>
