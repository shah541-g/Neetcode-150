<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img">
  <title>Binary Tree Right Side View dry run</title>
  <defs>
    <style>
      * { font-family: ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
      .s0,.s1,.s2,.s3 { opacity: 0; }
      .s0 { animation: s0 14s infinite; }
      .s1 { animation: s1 14s infinite; }
      .s2 { animation: s2 14s infinite; }
      .s3 { animation: s3 14s infinite; }
      @keyframes s0 { 0%,1%,19%,100% { opacity: 1; } 20%,99% { opacity: 0; } }
      @keyframes s1 { 0%,23% { opacity: 0; } 24%,44% { opacity: 1; } 45%,100% { opacity: 0; } }
      @keyframes s2 { 0%,47% { opacity: 0; } 48%,68% { opacity: 1; } 69%,100% { opacity: 0; } }
      @keyframes s3 { 0%,71% { opacity: 0; } 72%,94% { opacity: 1; } 95%,100% { opacity: 0; } }
      @media(prefers-reduced-motion:reduce){*{animation:none!important}.c1,.c2,.c3,.c4,.c5,.c6,.c7{opacity:0!important}:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7):not(:has(~:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7))){opacity:1!important}.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10{opacity:0!important}:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10):not(:has(~:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10))){opacity:1!important}.row1,.row2,.row3{opacity:0!important}:is(.row1,.row2,.row3):not(:has(~:is(.row1,.row2,.row3))){opacity:1!important}.v1,.v2,.v3,.v4,.v5,.v6{opacity:0!important}:is(.v1,.v2,.v3,.v4,.v5,.v6):not(:has(~:is(.v1,.v2,.v3,.v4,.v5,.v6))){opacity:1!important}.out0,.out1,.out2{opacity:0!important}:is(.out0,.out1,.out2):not(:has(~:is(.out0,.out1,.out2))){opacity:1!important}[class^=cap]{opacity:0!important}[class^=cap]:not(:has(~[class^=cap])){opacity:1!important}[class^=count]{opacity:0!important}[class^=count]:not(:has(~[class^=count])){opacity:1!important}[class^=state]{opacity:0!important}[class^=state]:not(:has(~[class^=state])){opacity:1!important}[class^=step]{opacity:0!important}[class^=step]:not(:has(~[class^=step])){opacity:1!important}svg:has(.final) [class^=cap]{opacity:0!important}.final{opacity:1!important}[class^=p],[class*=" p"]{display:none!important}}
    </style>
    <style>* { animation-timing-function: steps(1, end) !important; }</style>
  </defs>
  <rect width="800" height="360" rx="24" fill="#0f172a"/>
  <text x="32" y="38" fill="#94a3b8" font-size="16" class="mono">source test: [1,2,3,null,5,null,4]</text>
  <g class="s0"><text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Level 1 / 3</text></g>
  <g class="s1"><text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Level 2 / 3</text></g>
  <g class="s2"><text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Level 3 / 3</text></g>
  <g class="s3"><text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Return</text></g>
  <g fill="none" stroke="#475569" stroke-width="3">
    <path d="M270 108 L160 145"/><path d="M270 108 L380 145"/>
    <path d="M160 197 L220 220"/><path d="M380 197 L440 220"/>
  </g>
  <g fill="#1e293b" stroke="#475569" stroke-width="2">
    <rect x="236" y="58" width="68" height="48" rx="16"/>
    <rect x="126" y="147" width="68" height="48" rx="16"/>
    <rect x="346" y="147" width="68" height="48" rx="16"/>
    <rect x="186" y="222" width="68" height="48" rx="16"/>
    <rect x="406" y="222" width="68" height="48" rx="16"/>
  </g>
  <g fill="#e2e8f0" font-size="19" font-weight="700" class="mono" text-anchor="middle">
    <text x="270" y="90">1</text><text x="160" y="179">2</text><text x="380" y="179">3</text>
    <text x="220" y="254">5</text><text x="440" y="254">4</text>
  </g>
  <rect x="535" y="70" width="225" height="168" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="647" y="98" text-anchor="middle" fill="#94a3b8" font-size="16">QUEUE AND RESULT</text>
  <g class="s0"><text x="647" y="145" text-anchor="middle" fill="#e2e8f0" font-size="15" class="mono">q=[2,3]; res=[1]</text></g>
  <g class="s1"><text x="647" y="139" text-anchor="middle" fill="#e2e8f0" font-size="15" class="mono">q=[null,5,null,4]</text><text x="647" y="164" text-anchor="middle" fill="#e2e8f0" font-size="15" class="mono">res=[1,3]</text></g>
  <g class="s2"><text x="647" y="139" text-anchor="middle" fill="#e2e8f0" font-size="15" class="mono">q=[null,null,null,null]</text><text x="647" y="164" text-anchor="middle" fill="#e2e8f0" font-size="15" class="mono">res=[1,3,4]</text></g>
  <g class="s3"><text x="647" y="145" text-anchor="middle" fill="#22c55e" font-size="16" class="mono">return [1,3,4]</text></g>
  <rect x="40" y="286" width="720" height="48" rx="12" fill="#1e293b"/>
  <g class="s0"><text x="400" y="316" text-anchor="middle" fill="#38bdf8" font-size="17" class="mono">Level 1: append 1; enqueue 2,3</text></g>
  <g class="s1"><text x="400" y="316" text-anchor="middle" fill="#38bdf8" font-size="17" class="mono">Level 2: append 3; enqueue null,5,null,4</text></g>
  <g class="s2"><text x="400" y="316" text-anchor="middle" fill="#38bdf8" font-size="17" class="mono">Level 3: append 4; remaining queue is nulls</text></g>
  <g class="s3"><text x="400" y="316" text-anchor="middle" fill="#22c55e" font-size="17" class="mono">Return [1,3,4]</text></g>
</svg>
