<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img">
  <title>Same Tree animated dry run</title>
  <defs>
    <style>
      * { font-family: ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
:root { --total: 14s; }
.cap0,.state0,.step0 { animation: cap0 var(--total) infinite; }
@keyframes cap0 { 0%,0.0%{opacity:0} 1.0%,14.0%{opacity:1} 15.0%,100%{opacity:0} }
.cap1,.state1,.step1 { animation: cap1 var(--total) infinite; }
@keyframes cap1 { 0%,14.0%{opacity:0} 15.0%,28.0%{opacity:1} 29.0%,100%{opacity:0} }
.cap2,.state2,.step2 { animation: cap2 var(--total) infinite; }
@keyframes cap2 { 0%,28.0%{opacity:0} 29.0%,42.0%{opacity:1} 43.0%,100%{opacity:0} }
.cap3,.state3,.step3 { animation: cap3 var(--total) infinite; }
@keyframes cap3 { 0%,42.0%{opacity:0} 43.0%,56.0%{opacity:1} 57.0%,100%{opacity:0} }
.cap4,.state4,.step4 { animation: cap4 var(--total) infinite; }
@keyframes cap4 { 0%,56.0%{opacity:0} 57.0%,70.0%{opacity:1} 71.0%,100%{opacity:0} }

      @media(prefers-reduced-motion:reduce){*{animation:none!important}.c1,.c2,.c3,.c4,.c5,.c6,.c7{opacity:0!important}:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7):not(:has(~:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7))){opacity:1!important}.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10{opacity:0!important}:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10):not(:has(~:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10))){opacity:1!important}.row1,.row2,.row3{opacity:0!important}:is(.row1,.row2,.row3):not(:has(~:is(.row1,.row2,.row3))){opacity:1!important}.v1,.v2,.v3,.v4,.v5,.v6{opacity:0!important}:is(.v1,.v2,.v3,.v4,.v5,.v6):not(:has(~:is(.v1,.v2,.v3,.v4,.v5,.v6))){opacity:1!important}.out0,.out1,.out2{opacity:0!important}:is(.out0,.out1,.out2):not(:has(~:is(.out0,.out1,.out2))){opacity:1!important}[class^=cap]{opacity:0!important}[class^=cap]:not(:has(~[class^=cap])){opacity:1!important}[class^=count]{opacity:0!important}[class^=count]:not(:has(~[class^=count])){opacity:1!important}[class^=state]{opacity:0!important}[class^=state]:not(:has(~[class^=state])){opacity:1!important}[class^=step]{opacity:0!important}[class^=step]:not(:has(~[class^=step])){opacity:1!important}svg:has(.final) [class^=cap]{opacity:0!important}.final{opacity:1!important}[class^=p],[class*=" p"]{display:none!important}}
    </style>
    <style>* { animation-timing-function: steps(1, end) !important; }</style>
  </defs>
  <rect width="800" height="360" rx="24" fill="#0f172a"/>
<text x="32" y="38" fill="#94a3b8" font-size="16" class="mono">p=q=[1,2,3]; recurse left before right</text>
<g class="step0"><text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 1 / 4</text></g>
<g class="step1"><text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 2 / 4</text></g>
<g class="step2"><text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Base case</text></g>
<g class="step3"><text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 3 / 4</text></g>
<g class="step4"><text x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Return</text></g>
<g><path d="M245 108 L165 145" fill="none" stroke="#475569" stroke-width="3"/><path d="M245 108 L325 145" fill="none" stroke="#475569" stroke-width="3"/><rect x="211" y="58" width="68" height="48" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="245" y="90" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="700" class="mono">1</text><rect x="131" y="147" width="68" height="48" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="165" y="179" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="700" class="mono">2</text><rect x="291" y="147" width="68" height="48" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="325" y="179" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="700" class="mono">3</text></g><rect x="585" y="70" width="170" height="168" rx="16" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/><text x="670" y="98" text-anchor="middle" fill="#94a3b8" font-size="16">DATA STATE</text><g class="state0"><text x="670" y="145" text-anchor="middle" fill="#e2e8f0" font-size="16" class="mono">p=1, q=1</text></g><g class="state1"><text x="670" y="145" text-anchor="middle" fill="#e2e8f0" font-size="16" class="mono">left: 2==2</text></g><g class="state2"><text x="670" y="145" text-anchor="middle" fill="#e2e8f0" font-size="14" class="mono">both children null</text></g><g class="state3"><text x="670" y="145" text-anchor="middle" fill="#e2e8f0" font-size="16" class="mono">right: 3==3</text></g><g class="state4"><text x="670" y="145" text-anchor="middle" fill="#e2e8f0" font-size="16" class="mono">return true</text></g>
  <rect x="55" y="270" width="690" height="58" rx="12" fill="#1e293b"/>
<g class="cap0"><text x="400" y="306" text-anchor="middle" fill="#38bdf8" font-size="18" class="mono">compare roots: 1==1</text></g>
<g class="cap1"><text x="400" y="306" text-anchor="middle" fill="#38bdf8" font-size="18" class="mono">recurse left: 2==2</text></g>
<g class="cap2"><text x="400" y="306" text-anchor="middle" fill="#38bdf8" font-size="18" class="mono">both children of 2 are null</text></g>
<g class="cap3"><text x="400" y="306" text-anchor="middle" fill="#38bdf8" font-size="18" class="mono">recurse right: 3==3</text></g>
<g class="cap4"><text x="400" y="306" text-anchor="middle" fill="#22c55e" font-size="18" class="mono">both subtrees match; return true</text></g>

</svg>
