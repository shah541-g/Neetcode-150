<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Valid Palindrome overview</title><desc id="desc">Two pointers skip non-alphanumeric characters and compare lowercase characters from opposite ends.</desc><rect width="800" height="360" rx="18" fill="#0f172a"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e2e8f0}.sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.card{fill:#1e293b;stroke:#475569;stroke-width:1.5}.muted{fill:#94a3b8}.blue{fill:#38bdf8}.amber{fill:#f59e0b}.green{fill:#22c55e}.purple{fill:#a78bfa}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><text class="sans" x="40" y="34" font-size="20" font-weight="700">Valid Palindrome | compare filtered ends</text><text class="sans" x="40" y="59" font-size="14" fill="#94a3b8">Lowercase first; skip non-alphanumeric chars before comparing each pair.</text><rect x="45" y="91" width="710" height="70" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="400" y="122" font-size="18" text-anchor="middle">a   m   a   n   ,   a   ...   p   a   n   a   m   a</text><text class="sans" x="92" y="149" font-size="14" text-anchor="middle" font-weight="700" fill="#38bdf8">left</text><text class="sans" x="708" y="149" font-size="14" text-anchor="middle" font-weight="700" fill="#f59e0b">right</text><path d="M92 163V194M708 163V194" stroke="#38bdf8" stroke-width="3"/><path d="M708 163V194" stroke="#f59e0b" stroke-width="3"/><path d="M92 195H708" stroke="#475569" stroke-width="2"/><rect x="85" y="226" width="290" height="79" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="sans" x="230" y="255" font-size="15" text-anchor="middle">skip spaces / punctuation</text><text class="mono" x="230" y="281" font-size="15" text-anchor="middle" fill="#38bdf8">isalnum(s[index])</text><rect x="425" y="226" width="290" height="79" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="sans" x="570" y="255" font-size="15" text-anchor="middle">compare lowercase chars</text><text class="mono" x="570" y="281" font-size="15" text-anchor="middle" fill="#22c55e">match -> move both inward</text></svg>