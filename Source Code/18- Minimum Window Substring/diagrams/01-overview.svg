<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img">
  <title>Expand then shrink sliding window for minimum window substring</title>
  <rect width="800" height="360" rx="18" fill="#0f172a"/>
  <text x="40" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="20" font-weight="700">Key idea: expand until valid, then shrink for the minimum</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" text-anchor="middle">
    <g transform="translate(70 92)"><rect width="62" height="62" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="31" y="40" fill="#38bdf8">A</text></g>
    <g transform="translate(142 92)"><rect width="62" height="62" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="31" y="40" fill="#94a3b8">D</text></g>
    <g transform="translate(214 92)"><rect width="62" height="62" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="31" y="40" fill="#94a3b8">O</text></g>
    <g transform="translate(286 92)"><rect width="62" height="62" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="31" y="40" fill="#f59e0b">B</text></g>
    <g transform="translate(358 92)"><rect width="62" height="62" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="31" y="40" fill="#94a3b8">E</text></g>
    <g transform="translate(430 92)"><rect width="62" height="62" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="2"/><text x="31" y="40" fill="#22c55e">C</text></g>
  </g>
  <path d="M101 184 C101 220 461 220 461 184" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="7 7"/>
  <text x="281" y="215" fill="#38bdf8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">right expands; left shrinks</text>
  <rect x="540" y="82" width="220" height="132" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="650" y="108" fill="#94a3b8" font-family="sans-serif" font-size="15" text-anchor="middle">target tMap</text>
  <text x="650" y="145" fill="#a78bfa" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" text-anchor="middle">A=1 B=1 C=1</text>
  <text x="650" y="180" fill="#22c55e" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" text-anchor="middle">created=3</text>
  <rect x="220" y="250" width="360" height="64" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="289" fill="#22c55e" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" text-anchor="middle">minimum = "BANC"</text>
  <style>
    .pulse{animation:pulse 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
</svg>
