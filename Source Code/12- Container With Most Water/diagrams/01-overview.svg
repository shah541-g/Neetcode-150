<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Container With Most Water overview</title><desc id="desc">Area uses width times the shorter endpoint height, then code moves the shorter side inward (right on a tie).</desc><rect width="800" height="360" rx="18" fill="#0f172a"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e2e8f0}.sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.card{fill:#1e293b;stroke:#475569;stroke-width:1.5}.muted{fill:#94a3b8}.blue{fill:#38bdf8}.amber{fill:#f59e0b}.green{fill:#22c55e}.purple{fill:#a78bfa}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><text class="sans" x="40" y="34" font-size="20" font-weight="700">Container With Most Water | move shorter wall</text><text class="sans" x="40" y="59" font-size="14" fill="#94a3b8">The shorter line limits area; narrowing width while keeping it cannot improve that limit.</text><path d="M180 278V145M620 278V181" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/><rect x="188" y="181" width="424" height="93" rx="6" fill="#38bdf8" opacity=".22" stroke="#38bdf8" stroke-width="2"/><text class="mono" x="180" y="132" font-size="15" text-anchor="middle" fill="#38bdf8">height[left]</text><text class="mono" x="620" y="168" font-size="15" text-anchor="middle" fill="#f59e0b">height[right]</text><path d="M190 299H610" stroke="#94a3b8" stroke-width="2"/><path d="M190 299l10-6v12zM610 299l-10-6v12z" fill="#94a3b8"/><text class="mono" x="400" y="324" font-size="16" text-anchor="middle">area = (right - left) * min(height[left], height[right])</text><text class="sans" x="400" y="350" font-size="14" text-anchor="middle" fill="#22c55e">left &gt;= right -> right--     otherwise left++</text></svg>