<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Two Sum II overview</title><desc id="desc">On a sorted array, move the endpoint that makes the sum approach the target.</desc><rect width="800" height="360" rx="18" fill="#0f172a"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e2e8f0}.sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.card{fill:#1e293b;stroke:#475569;stroke-width:1.5}.muted{fill:#94a3b8}.blue{fill:#38bdf8}.amber{fill:#f59e0b}.green{fill:#22c55e}.purple{fill:#a78bfa}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><text class="sans" x="40" y="34" font-size="20" font-weight="700">Two Sum II | use sorted order</text><text class="sans" x="40" y="59" font-size="14" fill="#94a3b8">A too-large sum loses the right endpoint; a too-small sum loses the left.</text><rect x="100" y="117" width="112" height="58" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="156" y="153" font-size="20" text-anchor="middle" font-weight="700">2</text><text class="mono" x="156" y="198" font-size="14" text-anchor="middle" fill="#94a3b8">0</text><rect x="250" y="117" width="112" height="58" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="306" y="153" font-size="20" text-anchor="middle" font-weight="700">7</text><text class="mono" x="306" y="198" font-size="14" text-anchor="middle" fill="#94a3b8">1</text><rect x="400" y="117" width="112" height="58" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="456" y="153" font-size="20" text-anchor="middle" font-weight="700">11</text><text class="mono" x="456" y="198" font-size="14" text-anchor="middle" fill="#94a3b8">2</text><rect x="550" y="117" width="112" height="58" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="606" y="153" font-size="20" text-anchor="middle" font-weight="700">15</text><text class="mono" x="606" y="198" font-size="14" text-anchor="middle" fill="#94a3b8">3</text><path d="M156 105V89H606" fill="none" stroke="#38bdf8" stroke-width="3"/><path d="M606 89l-9-6v12z" fill="#38bdf8"/><path d="M606 215V231H306" fill="none" stroke="#f59e0b" stroke-width="3"/><path d="M306 231l9-6v12z" fill="#f59e0b"/><text class="sans" x="156" y="82" font-size="14" text-anchor="middle" font-weight="700" fill="#38bdf8">left -> increase</text><text class="sans" x="606" y="251" font-size="14" text-anchor="middle" font-weight="700" fill="#f59e0b">right -> decrease</text><rect x="150" y="273" width="500" height="56" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="400" y="298" font-size="15" text-anchor="middle">sum &gt; target: right--    |    sum &lt; target: left++</text><text class="sans" x="400" y="320" font-size="14" text-anchor="middle" fill="#22c55e">sum == target: return 1-based positions</text></svg>