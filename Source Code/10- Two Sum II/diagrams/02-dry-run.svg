<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Two Sum II dry run</title><desc id="desc">Three source iterations: two oversized sums move right, then sum 9 returns one-based positions.</desc><rect width="800" height="360" rx="18" fill="#0f172a"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e2e8f0}.sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}:root{--step:2.5s;--total:14s}.pointer{transform-box:fill-box;transform-origin:center;animation-duration:var(--total);animation-iteration-count:infinite;animation-timing-function:linear}.cap0,.count0{opacity:0;animation:show0 var(--total) linear infinite}@keyframes show0{0%,0.0000%{opacity:0}0.3500%,27.4278%{opacity:1}27.7778%,100%{opacity:0}}.cap1,.count1{opacity:0;animation:show1 var(--total) linear infinite}@keyframes show1{0%,27.7778%{opacity:0}28.1278%,55.2055%{opacity:1}55.5555%,100%{opacity:0}}.cap2,.count2{opacity:0;animation:show2 var(--total) linear infinite}@keyframes show2{0%,55.5555%{opacity:0}55.9055%,82.9833%{opacity:1}83.3333%,100%{opacity:0}}.final{opacity:0;animation:final var(--total) linear infinite}@keyframes final{0%,82.9833%{opacity:0}83.3333%,97.5000%{opacity:1}100%{opacity:0}}.pl{animation-name:track-pl}@keyframes track-pl{0.0000%{transform:translateX(0px)}27.7778%{transform:translateX(0px)}55.5555%{transform:translateX(0px)}83.3333%{transform:translateX(0px)}95.0000%{transform:translateX(0px)}97.5000%{transform:translateX(0px)}100.0000%{transform:translateX(0px)}}.pr{animation-name:track-pr}@keyframes track-pr{0.0000%{transform:translateX(0px)}27.7778%{transform:translateX(0px)}55.5555%{transform:translateX(-140px)}83.3333%{transform:translateX(-280px)}95.0000%{transform:translateX(-280px)}97.5000%{transform:translateX(-280px)}100.0000%{transform:translateX(0px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.c1,.c2,.c3,.c4,.c5,.c6,.c7{opacity:0!important}:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7):not(:has(~:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7))){opacity:1!important}.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10{opacity:0!important}:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10):not(:has(~:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10))){opacity:1!important}.row1,.row2,.row3{opacity:0!important}:is(.row1,.row2,.row3):not(:has(~:is(.row1,.row2,.row3))){opacity:1!important}.v1,.v2,.v3,.v4,.v5,.v6{opacity:0!important}:is(.v1,.v2,.v3,.v4,.v5,.v6):not(:has(~:is(.v1,.v2,.v3,.v4,.v5,.v6))){opacity:1!important}.out0,.out1,.out2{opacity:0!important}:is(.out0,.out1,.out2):not(:has(~:is(.out0,.out1,.out2))){opacity:1!important}[class^=cap]{opacity:0!important}[class^=cap]:not(:has(~[class^=cap])){opacity:1!important}[class^=count]{opacity:0!important}[class^=count]:not(:has(~[class^=count])){opacity:1!important}[class^=state]{opacity:0!important}[class^=state]:not(:has(~[class^=state])){opacity:1!important}[class^=step]{opacity:0!important}[class^=step]:not(:has(~[class^=step])){opacity:1!important}svg:has(.final) [class^=cap]{opacity:0!important}.final{opacity:1!important}[class^=p],[class*=" p"]{display:none!important}}</style><text class="sans" x="40" y="34" font-size="20" font-weight="700">Two Sum II | numbers = [2,7,11,15], target = 9</text><text class="sans" x="40" y="59" font-size="14" fill="#94a3b8">The sorted endpoint sum selects which pointer moves.</text><rect x="100" y="131" width="112" height="58" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="156" y="168" font-size="20" text-anchor="middle" font-weight="700">2</text><text class="mono" x="156" y="213" font-size="14" text-anchor="middle" fill="#94a3b8">0</text><rect x="240" y="131" width="112" height="58" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="296" y="168" font-size="20" text-anchor="middle" font-weight="700">7</text><text class="mono" x="296" y="213" font-size="14" text-anchor="middle" fill="#94a3b8">1</text><rect x="380" y="131" width="112" height="58" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="436" y="168" font-size="20" text-anchor="middle" font-weight="700">11</text><text class="mono" x="436" y="213" font-size="14" text-anchor="middle" fill="#94a3b8">2</text><rect x="520" y="131" width="112" height="58" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="576" y="168" font-size="20" text-anchor="middle" font-weight="700">15</text><text class="mono" x="576" y="213" font-size="14" text-anchor="middle" fill="#94a3b8">3</text><g class="pointer pl"><text x="156" y="95" font-size="14" text-anchor="middle" fill="#38bdf8" font-weight="700">left</text><path d="M149 106H163L156 120Z" fill="#38bdf8"/></g><g class="pointer pr"><text x="576" y="95" font-size="14" text-anchor="middle" fill="#f59e0b" font-weight="700">right</text><path d="M569 106H583L576 120Z" fill="#f59e0b"/></g><rect x="100" y="235" width="600" height="74" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text class="mono" x="130" y="266" font-size="16" fill="#a78bfa">target = 9</text><text class="cap0 mono" x="130" y="291" font-size="15">sum=2+15=17 &gt; 9 -> right--</text><text class="count0 mono" x="750" y="35" font-size="14" text-anchor="end">Step 1 / 3</text><text class="cap1 mono" x="130" y="291" font-size="15">sum=2+11=13 &gt; 9 -> right--</text><text class="count1 mono" x="750" y="35" font-size="14" text-anchor="end">Step 2 / 3</text><text class="cap2 mono" x="130" y="291" font-size="15">sum=2+7=9 -> return {left+1,right+1} = {1,2}</text><text class="count2 mono" x="750" y="35" font-size="14" text-anchor="end">Step 3 / 3</text><text class="final mono" x="130" y="291" font-size="16" fill="#22c55e">return [1,2] (1-based)</text></svg>