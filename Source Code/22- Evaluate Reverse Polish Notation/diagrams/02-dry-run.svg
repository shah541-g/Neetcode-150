<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img">
  <title>Evaluate Reverse Polish Notation dry run</title>
  <desc>Trace of 4,13,5,division,addition; the first pop is the right operand.</desc>
  <defs>
    <style>
      * { font-family: ui-sans-serif, system-ui, sans-serif; }
      .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
      :root { --total: 14s; }
      .pointer { animation: pointer var(--total) linear infinite; transform-box: fill-box; transform-origin: center; }
      .s1,.s2,.s3,.s4,.s5 { opacity: 0; animation-duration: var(--total); animation-iteration-count: infinite; }
      .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; }
      .s4 { animation-name: s4; } .s5 { animation-name: s5; }
      @keyframes pointer {
        0%,1% { transform: translateX(0); opacity: 0; }
        2%,16% { transform: translateX(0); opacity: 1; }
        18%,32% { transform: translateX(78px); opacity: 1; }
        34%,48% { transform: translateX(156px); opacity: 1; }
        50%,64% { transform: translateX(234px); opacity: 1; }
        66%,88% { transform: translateX(312px); opacity: 1; }
        96% { transform: translateX(312px); opacity: 0; }
        100% { transform: translateX(0); opacity: 0; }
      }
      @keyframes s1 { 0%,15%,96%,100% { opacity: 1; } 17%,94% { opacity: 0; } }
      @keyframes s2 { 0%,100% { opacity: 0; } 18%,32% { opacity: 1; } 34%,98% { opacity: 0; } }
      @keyframes s3 { 0%,100% { opacity: 0; } 34%,48% { opacity: 1; } 50%,98% { opacity: 0; } }
      @keyframes s4 { 0%,100% { opacity: 0; } 50%,64% { opacity: 1; } 66%,98% { opacity: 0; } }
      @keyframes s5 { 0%,100% { opacity: 0; } 66%,90% { opacity: 1; } 92%,98% { opacity: 0; } }
      @media(prefers-reduced-motion:reduce){*{animation:none!important}.c1,.c2,.c3,.c4,.c5,.c6,.c7{opacity:0!important}:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7):not(:has(~:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7))){opacity:1!important}.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10{opacity:0!important}:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10):not(:has(~:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10))){opacity:1!important}.row1,.row2,.row3{opacity:0!important}:is(.row1,.row2,.row3):not(:has(~:is(.row1,.row2,.row3))){opacity:1!important}.v1,.v2,.v3,.v4,.v5,.v6{opacity:0!important}:is(.v1,.v2,.v3,.v4,.v5,.v6):not(:has(~:is(.v1,.v2,.v3,.v4,.v5,.v6))){opacity:1!important}.out0,.out1,.out2{opacity:0!important}:is(.out0,.out1,.out2):not(:has(~:is(.out0,.out1,.out2))){opacity:1!important}[class^=cap]{opacity:0!important}[class^=cap]:not(:has(~[class^=cap])){opacity:1!important}[class^=count]{opacity:0!important}[class^=count]:not(:has(~[class^=count])){opacity:1!important}[class^=state]{opacity:0!important}[class^=state]:not(:has(~[class^=state])){opacity:1!important}[class^=step]{opacity:0!important}[class^=step]:not(:has(~[class^=step])){opacity:1!important}svg:has(.final) [class^=cap]{opacity:0!important}.final{opacity:1!important}[class^=p],[class*=" p"]{display:none!important}}
    </style>
    <style>* { animation-timing-function: steps(1, end) !important; }</style>
  </defs>
  <rect width="800" height="360" rx="24" fill="#0f172a"/>
  <text x="32" y="38" fill="#94a3b8" font-size="16" class="mono">tokens = [4,13,5,/, +]</text>
  <text class="s1 mono" x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 1 / 5</text>
  <text class="s2 mono" x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 2 / 5</text>
  <text class="s3 mono" x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 3 / 5</text>
  <text class="s4 mono" x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 4 / 5</text>
  <text class="s5 mono" x="768" y="38" text-anchor="end" fill="#94a3b8" font-size="16">Step 5 / 5</text>
  <g class="mono" text-anchor="middle" font-size="22">
    <g transform="translate(38 102)"><rect width="62" height="68" rx="10" fill="#1e293b" stroke="#475569"/><text x="31" y="43">4</text><text x="31" y="90" fill="#94a3b8" font-size="14">0</text></g>
    <g transform="translate(116 102)"><rect width="62" height="68" rx="10" fill="#1e293b" stroke="#475569"/><text x="31" y="43">13</text><text x="31" y="90" fill="#94a3b8" font-size="14">1</text></g>
    <g transform="translate(194 102)"><rect width="62" height="68" rx="10" fill="#1e293b" stroke="#475569"/><text x="31" y="43">5</text><text x="31" y="90" fill="#94a3b8" font-size="14">2</text></g>
    <g transform="translate(272 102)"><rect width="62" height="68" rx="10" fill="#1e293b" stroke="#475569"/><text x="31" y="43">/</text><text x="31" y="90" fill="#94a3b8" font-size="14">3</text></g>
    <g transform="translate(350 102)"><rect width="62" height="68" rx="10" fill="#1e293b" stroke="#475569"/><text x="31" y="43">+</text><text x="31" y="90" fill="#94a3b8" font-size="14">4</text></g>
  </g>
  <g class="pointer"><path d="M69 88 L61 72 H77 Z" fill="#38bdf8"/></g>
  <rect x="550" y="70" width="205" height="168" rx="14" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="652" y="98" text-anchor="middle" fill="#94a3b8" font-size="16">numbersStack</text>
  <g class="s1 mono" text-anchor="middle" font-size="16"><text x="652" y="150">[4]</text></g>
  <g class="s2 mono" text-anchor="middle" font-size="16"><text x="652" y="150">[4,13]</text></g>
  <g class="s3 mono" text-anchor="middle" font-size="16"><text x="652" y="150">[4,13,5]</text></g>
  <g class="s4 mono" text-anchor="middle" font-size="16"><text x="652" y="150">[4,2]</text></g>
  <g class="s5 mono" text-anchor="middle" font-size="16"><text x="652" y="150">[6]</text><text x="652" y="192" fill="#22c55e">answer = 6</text></g>
  <rect x="40" y="270" width="720" height="58" rx="12" fill="#1e293b"/>
  <g class="s1"><text x="400" y="306" text-anchor="middle" fill="#38bdf8" font-size="16" class="mono">token 4: push 4</text></g>
  <g class="s2"><text x="400" y="306" text-anchor="middle" fill="#38bdf8" font-size="16" class="mono">token 13: push 13</text></g>
  <g class="s3"><text x="400" y="306" text-anchor="middle" fill="#38bdf8" font-size="16" class="mono">token 5: push 5</text></g>
  <g class="s4"><text x="400" y="306" text-anchor="middle" fill="#f59e0b" font-size="16" class="mono">/ pops a=5 (right), b=13 (left); pushes b/a=2</text></g>
  <g class="s5"><text x="400" y="306" text-anchor="middle" fill="#22c55e" font-size="16" class="mono">+ pops 2 and 4; pushes 6; return 6</text></g>
  <text x="400" y="348" text-anchor="middle" fill="#94a3b8" font-size="15" class="mono">integer division: 13 / 5 = 2 · loop 14s</text>
</svg>
