<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Group Anagrams dry run</title>
  <desc id="desc">Twelve-second walkthrough of the six strings using 26 letter counts serialized with separators.</desc>
  <rect width="800" height="360" rx="18" fill="#0f172a"/>
  <style>
    text { font-family: sans-serif; fill: #e2e8f0 }
    .mono { font-family: ui-monospace, Menlo, Consolas, monospace }
    .pointer { animation: pointer 14s infinite; transform-box: fill-box; transform-origin: center }
    .c1,.c2,.c3,.c4,.c5,.c6 { opacity:0 }
    .c1 { animation: c1 14s infinite } .c2 { animation: c2 14s infinite }
    .c3 { animation: c3 14s infinite } .c4 { animation: c4 14s infinite }
    .c5 { animation: c5 14s infinite } .c6 { animation: c6 14s infinite }
    .mapA,.mapB,.mapC { opacity:0 }
    .mapA { animation: mapA 14s infinite } .mapB { animation: mapB 14s infinite } .mapC { animation: mapC 14s infinite }
    .final { animation: final 14s infinite }
    @keyframes pointer {
      0%,8%{transform:translateX(0)} 10%,21%{transform:translateX(75px)} 23%,34%{transform:translateX(150px)}
      36%,47%{transform:translateX(225px)} 49%,60%{transform:translateX(300px)} 62%,75%{transform:translateX(375px)} 77%,88%{transform:translateX(0)} 100%{transform:translateX(0)}
    }
    @keyframes c1 {0%,8%{opacity:1}10%{opacity:0}100%{opacity:1}}
    @keyframes c2 {0%,8%,23%,100%{opacity:0} 10%,21%{opacity:1}}
    @keyframes c3 {0%,21%,36%,100%{opacity:0} 23%,34%{opacity:1}}
    @keyframes c4 {0%,34%,49%,100%{opacity:0} 36%,47%{opacity:1}}
    @keyframes c5 {0%,47%,62%,100%{opacity:0} 49%,60%{opacity:1}}
    @keyframes c6 {0%,60%,77%,100%{opacity:0} 62%,75%{opacity:1}}
    @keyframes mapA {0%,10%,100%{opacity:0} 11%,88%{opacity:1}}
    @keyframes mapB {0%,23%,100%{opacity:0} 24%,88%{opacity:1}}
    @keyframes mapC {0%,60%,100%{opacity:0} 61%,88%{opacity:1}}
    @keyframes final {0%,88%{opacity:.35}91%{opacity:1}100%{opacity:.35}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.c1,.c2,.c3,.c4,.c5,.c6,.c7{opacity:0!important}:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7):not(:has(~:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7))){opacity:1!important}.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10{opacity:0!important}:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10):not(:has(~:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10))){opacity:1!important}.row1,.row2,.row3{opacity:0!important}:is(.row1,.row2,.row3):not(:has(~:is(.row1,.row2,.row3))){opacity:1!important}.v1,.v2,.v3,.v4,.v5,.v6{opacity:0!important}:is(.v1,.v2,.v3,.v4,.v5,.v6):not(:has(~:is(.v1,.v2,.v3,.v4,.v5,.v6))){opacity:1!important}.out0,.out1,.out2{opacity:0!important}:is(.out0,.out1,.out2):not(:has(~:is(.out0,.out1,.out2))){opacity:1!important}[class^=cap]{opacity:0!important}[class^=cap]:not(:has(~[class^=cap])){opacity:1!important}[class^=count]{opacity:0!important}[class^=count]:not(:has(~[class^=count])){opacity:1!important}[class^=state]{opacity:0!important}[class^=state]:not(:has(~[class^=state])){opacity:1!important}[class^=step]{opacity:0!important}[class^=step]:not(:has(~[class^=step])){opacity:1!important}svg:has(.final) [class^=cap]{opacity:0!important}.final{opacity:1!important}[class^=p],[class*=" p"]{display:none!important}}
  </style>
  <style>* { animation-timing-function: steps(1, end) !important; }</style>
  <text x="40" y="34" font-size="18" font-weight="700">for (string str : strs)</text>
  <text x="760" y="34" text-anchor="end" font-size="14" fill="#94a3b8">6 string iterations</text>
  <text class="c1 mono" x="760" y="56" text-anchor="end" font-size="14" fill="#94a3b8">Step 1 / 6</text>
  <text class="c2 mono" x="760" y="56" text-anchor="end" font-size="14" fill="#94a3b8">Step 2 / 6</text>
  <text class="c3 mono" x="760" y="56" text-anchor="end" font-size="14" fill="#94a3b8">Step 3 / 6</text>
  <text class="c4 mono" x="760" y="56" text-anchor="end" font-size="14" fill="#94a3b8">Step 4 / 6</text>
  <text class="c5 mono" x="760" y="56" text-anchor="end" font-size="14" fill="#94a3b8">Step 5 / 6</text>
  <text class="c6 mono" x="760" y="56" text-anchor="end" font-size="14" fill="#94a3b8">Step 6 / 6</text>
  <g transform="translate(40 72)">
    <g>
      <rect width="64" height="54" rx="8" fill="#1e293b" stroke="#475569"/><text x="32" y="35" text-anchor="middle" font-size="17" class="mono">eat</text>
      <rect x="75" width="64" height="54" rx="8" fill="#1e293b" stroke="#475569"/><text x="107" y="35" text-anchor="middle" font-size="17" class="mono">tea</text>
      <rect x="150" width="64" height="54" rx="8" fill="#1e293b" stroke="#475569"/><text x="182" y="35" text-anchor="middle" font-size="17" class="mono">tan</text>
      <rect x="225" width="64" height="54" rx="8" fill="#1e293b" stroke="#475569"/><text x="257" y="35" text-anchor="middle" font-size="17" class="mono">ate</text>
      <rect x="300" width="64" height="54" rx="8" fill="#1e293b" stroke="#475569"/><text x="332" y="35" text-anchor="middle" font-size="17" class="mono">nat</text>
      <rect x="375" width="64" height="54" rx="8" fill="#1e293b" stroke="#475569"/><text x="407" y="35" text-anchor="middle" font-size="17" class="mono">bat</text>
      <text x="32" y="74" text-anchor="middle" font-size="14" fill="#94a3b8">0</text><text x="107" y="74" text-anchor="middle" font-size="14" fill="#94a3b8">1</text>
      <text x="182" y="74" text-anchor="middle" font-size="14" fill="#94a3b8">2</text><text x="257" y="74" text-anchor="middle" font-size="14" fill="#94a3b8">3</text>
      <text x="332" y="74" text-anchor="middle" font-size="14" fill="#94a3b8">4</text><text x="407" y="74" text-anchor="middle" font-size="14" fill="#94a3b8">5</text>
    </g>
    <g class="pointer"><rect width="64" height="54" rx="8" fill="none" stroke="#38bdf8" stroke-width="4"/></g>
  </g>
  <g transform="translate(510 70)">
    <text y="14" transform="translate(0 -24)" font-size="16" font-weight="700">anagramsGroups</text>
    <g class="mapA"><rect y="8" width="250" height="56" rx="8" fill="#1e293b" stroke="#38bdf8"/><text x="16" y="31" font-size="14" fill="#94a3b8" class="mono">counts: a,e,t = 1</text><text x="16" y="52" font-size="16" fill="#22c55e" class="mono">eat, tea, ate</text></g>
    <g class="mapB"><rect y="76" width="250" height="56" rx="8" fill="#1e293b" stroke="#38bdf8"/><text x="16" y="99" font-size="14" fill="#94a3b8" class="mono">counts: a,n,t = 1</text><text x="16" y="120" font-size="16" fill="#22c55e" class="mono">tan, nat</text></g>
    <g class="mapC"><rect y="144" width="250" height="56" rx="8" fill="#1e293b" stroke="#38bdf8"/><text x="16" y="167" font-size="14" fill="#94a3b8" class="mono">counts: a,b,t = 1</text><text x="16" y="188" font-size="16" fill="#22c55e" class="mono">bat</text></g>
  </g>
  <g transform="translate(40 210)">
    <rect width="800" height="82" rx="10" fill="#1e293b" stroke="#475569"/>
    <text class="c1 mono" x="18" y="32" font-size="16">eat → serialize 26 counts → create map entry</text>
    <text class="c2 mono" x="18" y="32" font-size="16">tea → same count key → push_back tea</text>
    <text class="c3 mono" x="18" y="32" font-size="16">tan → different count key → create entry</text>
    <text class="c4 mono" x="18" y="32" font-size="16">ate → same key as eat → push_back ate</text>
    <text class="c5 mono" x="18" y="32" font-size="16">nat → same key as tan → push_back nat</text>
    <text class="c6 mono" x="18" y="32" font-size="16">bat → different count key → create entry</text>
  </g>
  <g class="final" transform="translate(40 318)">
    <text font-size="17" fill="#22c55e" font-weight="700">return ans = [[eat,tea,ate], [tan,nat], [bat]] (group order unspecified)</text>
  </g>
</svg>
