<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Product Except Self overview</title>
  <desc id="desc">A prefix pass stores products to the left, then a suffix pass multiplies in products to the right.</desc>
  <rect width="800" height="360" rx="18" fill="#0f172a"/>
  <style>
    text { font-family:sans-serif; fill:#e2e8f0 }
    .mono { font-family:ui-monospace,Menlo,Consolas,monospace }
    .sweep { animation:sweep 6s ease-in-out infinite; transform-box:fill-box; transform-origin:center }
    @keyframes sweep {0%,100%{transform:translateX(0);opacity:.7}50%{transform:translateX(210px);opacity:1}}
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <text x="40" y="42" font-size="20" font-weight="700">left product × right product</text>
  <g transform="translate(40 78)">
    <text y="14" transform="translate(0 -24)" font-size="15" fill="#94a3b8">nums</text>
    <g><rect width="78" height="52" rx="8" fill="#1e293b" stroke="#475569"/><text x="39" y="34" text-anchor="middle" font-size="18" class="mono">1</text></g>
    <g transform="translate(92)"><rect width="78" height="52" rx="8" fill="#1e293b" stroke="#475569"/><text x="39" y="34" text-anchor="middle" font-size="18" class="mono">2</text></g>
    <g transform="translate(184)"><rect width="78" height="52" rx="8" fill="#1e293b" stroke="#475569"/><text x="39" y="34" text-anchor="middle" font-size="18" class="mono">3</text></g>
    <g transform="translate(276)"><rect width="78" height="52" rx="8" fill="#1e293b" stroke="#475569"/><text x="39" y="34" text-anchor="middle" font-size="18" class="mono">4</text></g>
  </g>
  <g transform="translate(40 168)">
    <text y="14" transform="translate(0 -24)" font-size="15" fill="#94a3b8">prefix pass: write pre, then pre *= nums[i]</text>
    <rect width="354" height="54" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <text x="177" y="35" text-anchor="middle" font-size="17" class="mono">[1, 1, 2, 6]</text>
  </g>
  <g transform="translate(430 168)">
    <text y="14" transform="translate(0 -24)" font-size="15" fill="#94a3b8">suffix pass: multiply ans[j] by post</text>
    <rect width="330" height="54" rx="8" fill="#1e293b" stroke="#f59e0b"/>
    <text x="165" y="35" text-anchor="middle" font-size="17" class="mono">[24,12,8,6]</text>
  </g>
  <rect class="sweep" x="40" y="246" width="354" height="42" rx="8" fill="#38bdf8" opacity=".18"/>
  <text x="40" y="312" font-size="15" fill="#94a3b8">For index i: ans[i] = pre · post</text>
  <rect x="430" y="246" width="330" height="54" rx="9" fill="#22c55e"/>
  <text x="595" y="281" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a" class="mono">[24,12,8,6]</text>
</svg>
