<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Valid Sudoku overview</title>
  <desc id="desc">Each filled cell is checked against one row set, one column set, and one 3 by 3 box set.</desc>
  <rect width="800" height="360" rx="18" fill="#0f172a"/>
  <style>
    text { font-family:sans-serif; fill:#e2e8f0 }
    .mono { font-family:ui-monospace,Menlo,Consolas,monospace }
    .pulse { animation:pulse 6s ease-in-out infinite; transform-box:fill-box; transform-origin:center }
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.68}}
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <text x="40" y="42" font-size="20" font-weight="700">One cell → row + column + box</text>
  <g transform="translate(40 72)">
    <rect width="270" height="270" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <g stroke="#475569" stroke-width="1">
      <path d="M30 0V270M60 0V270M90 0V270M120 0V270M150 0V270M180 0V270M210 0V270M240 0V270M270 0V270"/>
      <path d="M0 30H270M0 60H270M0 90H270M0 120H270M0 150H270M0 180H270M0 210H270M0 240H270M0 270H270"/>
    </g>
    <g stroke="#94a3b8" stroke-width="3"><path d="M90 0V270M180 0V270M0 90H270M0 180H270"/></g>
    <rect class="pulse" x="2" y="2" width="86" height="86" rx="5" fill="#38bdf8" opacity=".35"/>
    <rect x="0" y="0" width="30" height="30" rx="4" fill="#38bdf8"/>
    <text x="15" y="21" text-anchor="middle" font-size="16" class="mono">5</text>
  </g>
  <g transform="translate(360 92)">
    <rect width="400" height="78" rx="9" fill="#1e293b" stroke="#38bdf8"/>
    <text x="18" y="30" font-size="15" fill="#94a3b8">row 0 set</text><text x="150" y="30" font-size="17" class="mono">{5,3,…}</text>
    <text x="18" y="58" font-size="15" fill="#94a3b8">if count(5) → false</text>
  </g>
  <g transform="translate(360 184)">
    <rect width="400" height="78" rx="9" fill="#1e293b" stroke="#f59e0b"/>
    <text x="18" y="30" font-size="15" fill="#94a3b8">column 0 set</text><text x="150" y="30" font-size="17" class="mono">{5,6,…}</text>
  </g>
  <g transform="translate(360 276)">
    <rect width="400" height="54" rx="9" fill="#1e293b" stroke="#a78bfa"/>
    <text x="18" y="34" font-size="15" fill="#94a3b8">box 0 set</text><text x="135" y="34" font-size="17" class="mono">box=(i/3)*3+(j/3)</text>
  </g>
</svg>
