<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img">
  <title>Fixed window frequency comparison for permutation in string</title>
  <rect width="800" height="360" rx="18" fill="#0f172a"/>
  <text x="40" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="20" font-weight="700">Key idea: equal 26-letter counts mean a permutation</text>
  <text x="90" y="88" fill="#94a3b8" font-family="sans-serif" font-size="16">pattern s1</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" text-anchor="middle">
    <g transform="translate(90 110)"><rect width="76" height="64" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="38" y="42" fill="#38bdf8">a</text></g>
    <g transform="translate(176 110)"><rect width="76" height="64" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="38" y="42" fill="#f59e0b">b</text></g>
  </g>
  <text x="420" y="88" fill="#94a3b8" font-family="sans-serif" font-size="16">text window s2</text>
  <g transform="translate(420 110)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" text-anchor="middle">
    <rect width="76" height="64" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="38" y="42" fill="#f59e0b">b</text>
  </g>
  <g transform="translate(506 110)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" text-anchor="middle">
    <rect width="76" height="64" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="38" y="42" fill="#38bdf8">a</text>
  </g>
  <rect x="285" y="220" width="230" height="82" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="252" fill="#94a3b8" font-family="sans-serif" font-size="15" text-anchor="middle">matched counts</text>
  <text x="400" y="286" fill="#22c55e" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" text-anchor="middle">{a:1,b:1}</text>
  <path d="M400 200 C400 205 400 210 400 218" fill="none" stroke="#22c55e" stroke-width="3"/>
  <style>
    .pulse{animation:pulse 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
</svg>
