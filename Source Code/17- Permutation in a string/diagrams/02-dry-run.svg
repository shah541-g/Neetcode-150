<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img">
  <title>Animated dry run of Permutation in String for ab in eidbaooo</title>
  <rect width="800" height="360" rx="18" fill="#0f172a"/>
  <text x="40" y="38" fill="#e2e8f0" font-family="sans-serif" font-size="18" font-weight="700">s1 = "ab", s2 = "eidbaooo"</text>
  <text class="c1" x="750" y="38" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="end">Step 1 / 4</text>
  <text class="c2" x="750" y="38" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="end">Step 2 / 4</text>
  <text class="c3" x="750" y="38" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="end">Step 3 / 4</text>
  <text class="c4" x="750" y="38" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="end">Step 4 / 4</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" text-anchor="middle">
    <g transform="translate(55 82)"><rect width="68" height="58" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="34" y="37" fill="#e2e8f0">e</text><text x="34" y="78" fill="#94a3b8" font-size="14">0</text></g>
    <g transform="translate(133 82)"><rect width="68" height="58" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="34" y="37" fill="#e2e8f0">i</text><text x="34" y="78" fill="#94a3b8" font-size="14">1</text></g>
    <g transform="translate(211 82)"><rect width="68" height="58" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="34" y="37" fill="#e2e8f0">d</text><text x="34" y="78" fill="#94a3b8" font-size="14">2</text></g>
    <g transform="translate(289 82)"><rect width="68" height="58" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="34" y="37" fill="#e2e8f0">b</text><text x="34" y="78" fill="#94a3b8" font-size="14">3</text></g>
    <g transform="translate(367 82)"><rect width="68" height="58" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="34" y="37" fill="#e2e8f0">a</text><text x="34" y="78" fill="#94a3b8" font-size="14">4</text></g>
    <g transform="translate(445 82)"><rect width="68" height="58" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="34" y="37" fill="#e2e8f0">o</text><text x="34" y="78" fill="#94a3b8" font-size="14">5</text></g>
  </g>
  <rect id="window" x="45" y="72" width="156" height="78" rx="10" fill="#38bdf8" fill-opacity=".08" stroke="#38bdf8" stroke-width="3"/>
  <text x="89" y="178" fill="#38bdf8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">fixed window</text>
  <rect x="570" y="82" width="180" height="132" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="660" y="108" fill="#94a3b8" font-family="sans-serif" font-size="15" text-anchor="middle">s1Map</text>
  <text x="660" y="145" fill="#38bdf8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" text-anchor="middle">{a:1, b:1}</text>
  <text x="660" y="180" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">match(s1Map,s2Map)</text>
  <rect x="570" y="224" width="180" height="58" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text id="answer" x="660" y="260" fill="#22c55e" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">return true</text>
  <g font-family="sans-serif" font-size="16" text-anchor="middle">
    <text class="c1" x="300" y="278" fill="#94a3b8">initial window "ei": counts differ</text>
    <text class="c2" x="300" y="278" fill="#94a3b8">add d, remove e: window "id"</text>
    <text class="c3" x="300" y="278" fill="#94a3b8">add b, remove i: window "db"</text>
    <text class="c4" x="300" y="278" fill="#22c55e">add a, remove d: window "ba" matches</text>
  </g>
  <text x="400" y="328" fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">Loop: 10 seconds</text>
  <style>
    :root{--total:14s}
    #window{animation:window var(--total) linear infinite;transform-box:fill-box;transform-origin:center}
    .c1,.c2,.c3,.c4{opacity:0}
    .c1{animation:c1 var(--total) infinite}.c2{animation:c2 var(--total) infinite}.c3{animation:c3 var(--total) infinite}.c4{animation:c4 var(--total) infinite}
    #answer{animation:answer var(--total) infinite}
    @keyframes window{0%,22%{transform:translateX(0)}24%,44%{transform:translateX(78px)}46%,66%{transform:translateX(156px)}68%,94%{transform:translateX(234px)}96%{transform:translateX(234px)}100%{transform:translateX(0)}}
    @keyframes c1{0%,22%{opacity:1}24%{opacity:0}100%{opacity:1}}@keyframes c2{0%,24%{opacity:0}26%,44%{opacity:1}46%,100%{opacity:0}}@keyframes c3{0%,46%{opacity:0}48%,66%{opacity:1}68%,100%{opacity:0}}@keyframes c4{0%,68%{opacity:0}70%,94%{opacity:1}96%,100%{opacity:0}}
    @keyframes answer{0%,66%{opacity:.25}68%,94%{opacity:1}96%,100%{opacity:.25}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.c1,.c2,.c3,.c4,.c5,.c6,.c7{opacity:0!important}:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7):not(:has(~:is(.c1,.c2,.c3,.c4,.c5,.c6,.c7))){opacity:1!important}.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10{opacity:0!important}:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10):not(:has(~:is(.s0,.s1,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s10))){opacity:1!important}.row1,.row2,.row3{opacity:0!important}:is(.row1,.row2,.row3):not(:has(~:is(.row1,.row2,.row3))){opacity:1!important}.v1,.v2,.v3,.v4,.v5,.v6{opacity:0!important}:is(.v1,.v2,.v3,.v4,.v5,.v6):not(:has(~:is(.v1,.v2,.v3,.v4,.v5,.v6))){opacity:1!important}.out0,.out1,.out2{opacity:0!important}:is(.out0,.out1,.out2):not(:has(~:is(.out0,.out1,.out2))){opacity:1!important}[class^=cap]{opacity:0!important}[class^=cap]:not(:has(~[class^=cap])){opacity:1!important}[class^=count]{opacity:0!important}[class^=count]:not(:has(~[class^=count])){opacity:1!important}[class^=state]{opacity:0!important}[class^=state]:not(:has(~[class^=state])){opacity:1!important}[class^=step]{opacity:0!important}[class^=step]:not(:has(~[class^=step])){opacity:1!important}svg:has(.final) [class^=cap]{opacity:0!important}.final{opacity:1!important}[class^=p],[class*=" p"]{display:none!important}}
  </style>
  <style>* { animation-timing-function: steps(1, end) !important; }</style>
</svg>
