<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img">
  <title>Longest repeating character replacement window formula</title>
  <rect width="800" height="360" rx="18" fill="#0f172a"/>
  <text x="40" y="42" fill="#e2e8f0" font-family="sans-serif" font-size="20" font-weight="700">Key idea: replacements = window length - max letter frequency</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">
    <g transform="translate(90 92)"><rect width="70" height="62" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="35" y="40" fill="#38bdf8">A</text></g>
    <g transform="translate(170 92)"><rect width="70" height="62" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="35" y="40" fill="#e2e8f0">B</text></g>
    <g transform="translate(250 92)"><rect width="70" height="62" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><text x="35" y="40" fill="#38bdf8">A</text></g>
    <g transform="translate(330 92)"><rect width="70" height="62" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/><text x="35" y="40" fill="#e2e8f0">B</text></g>
  </g>
  <text x="245" y="190" fill="#94a3b8" font-family="sans-serif" font-size="16" text-anchor="middle">window length = 4</text>
  <rect x="430" y="82" width="270" height="160" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="565" y="108" fill="#94a3b8" font-family="sans-serif" font-size="15" text-anchor="middle">frequency array</text>
  <text x="470" y="148" fill="#38bdf8" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20">A = 2</text>
  <text x="470" y="184" fill="#f59e0b" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20">B = 2</text>
  <text x="470" y="220" fill="#22c55e" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20">maxFreq = 2</text>
  <rect x="150" y="252" width="500" height="64" rx="12" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="400" y="291" fill="#22c55e" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" text-anchor="middle">4 - 2 = 2 replacements</text>
  <style>
    .pulse{animation:pulse 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
</svg>
